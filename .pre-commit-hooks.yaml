# What a project outside Sen gets by naming this repository in its own .pre-commit-config.yaml.
- id: stl-format
  name: STL members are aligned
  description: Aligns the members of a compound type and the comments beside them
  language: script
  entry: .github/scripts/format_stl.py
  files: \.stl$
