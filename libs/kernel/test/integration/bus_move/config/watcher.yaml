kernel:
  crashReportDisabled: true

load:
  - name: ether
    group: 10
    discovery:
      type: TcpDiscovery
      value:
        beamPeriod: 200 ms
        beamExpiryTime: 1 s
        hubAddress:
          host: 127.0.0.1
          port: 65454

build:
  - name: watcherComponent
    group: 2
    freqHz: 100
    imports: [bus_move]
    objects:
      - name: watcher
        class: sen.test.bus_move.WatcherImpl
        bus: session.ctrl
