load:
  - name: ether
    group: 10
    runDiscoveryHub: 65457
    discovery:
      type: TcpDiscovery
      value:
        beamPeriod: 200 ms
        beamExpiryTime: 1 s
        hubAddress:
          host: 127.0.0.1
          port: 65457
  - name: runtime_fom_publisher
    group: 5
    fomDirectory: "@env(SEN_RUNTIME_PUBLISHER_FOM_DIR)"
    mappingsFile: "@env(SEN_RUNTIME_PUBLISHER_MAPPINGS_FILE)"
