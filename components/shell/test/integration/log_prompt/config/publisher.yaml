kernel:
  logConfig:
    level: debug

load:
  - name: ether
    group: 10
    runDiscoveryHub: 65454
    discovery:
      type: TcpDiscovery
      value:
        beamPeriod: 100 ms
        beamExpiryTime: 1 s
        hubAddress:
          host: 127.0.0.1
          port: 65454
  - name: shell
    group: 5

build:
  - name: publisher
    group: 3
    imports: [log_prompt_test]
    objects:
      - name: publisher
        class: log_prompt_test.PublisherImpl
