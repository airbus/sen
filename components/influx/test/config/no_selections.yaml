# Nothing selected. The component has to say that it will send nothing and carry on, rather than
# look configured and record silence.
load:
  - name: influx
    group: 4
    transport:
      type: Udp
      value:
        address: 127.0.0.1
        port: 18090
        maxMessageSize: 65500
    samplingPeriod: 20ms
