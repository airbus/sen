# A selection with no source. The component has to name the query it cannot read and refuse to
# start, rather than ending the process with a crash report over a typo.
load:
  - name: influx
    group: 4
    transport:
      type: Udp
      value:
        address: 127.0.0.1
        port: 18088
        maxMessageSize: 65500
    samplingPeriod: 20ms
    selections:
      - SELECT *
