line-length = 120
indent-width = 4
include = ["*.py"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[lint]
select = [
  "ARG",
  "B",
  "C",
  "D",
  "E",
  "F",
  "I",
  "PLC",
  "PLE",
  "PLW",
  "T10",
  "UP",
  "W",
]
ignore = [
  "D105", # The meaning of special member functions can be found in the python documentation
  "D203", # Conflicts with D211(blank-line-before-class)
  "D212",  # Conflicts with D213(multi-line-summary-second-line)
]
preview = true

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
# Tutorial scripts wrap their whole demo in one try block for error output.
"examples/**" = ["PLW0717"]
# Sanitizer output is quoted verbatim as test input. Reflowing a line would
# change the thing being parsed, so these fixtures are exempt from the width.
".github/scripts/test_summarise_sanitizer_reports.py" = ["E501"]
