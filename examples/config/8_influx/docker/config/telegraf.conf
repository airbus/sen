[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = ""
  omit_hostname = false

[[outputs.influxdb]]
  urls = ["http://127.0.0.1:8086"]

  database = "influx"
  username = ""
  password = ""

[[inputs.socket_listener]]
  service_address = "tcp://:8094"
  data_format = "influx"

  # Uncomment to accept a compressed payload. The Sen side has to ask for it too, with
  #   compression: { type: GZip, value: { level: 6 } }
  # Both halves must agree: a listener left at "identity" refuses what a compressing Sen sends.
  # content_encoding = "gzip"

# Uncomment to receive over HTTP instead, with the Sen side set to
#   transport: { type: Http, value: { address: 127.0.0.1, port: 8186, path: /write } }
# This listener answers 204 when it took the whole batch, and 400 when some line protocol was
# wrong -- usually keeping the rest -- which a socket listener cannot report at all. It
# decompresses a gzip body on its own, so no setting is needed
# here for compression.
# [[inputs.influxdb_listener]]
#   service_address = ":8186"
