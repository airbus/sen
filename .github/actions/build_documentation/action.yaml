name: "Build the documentation."
description: "Build the API reference and the handbook; the caller decides whether to publish the result."

runs:
  using: 'composite'
  steps:
    # Not for this action, which runs python inside the image: build_docs.yaml
    # installs mike on the runner immediately after calling it.
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
      with:
        python-version: 3.x

    - name: Name the image
      shell: bash
      env:
        SEN_CI_REGISTRY: ghcr.io/airbus/
      run: echo "SEN_CI_IMAGE=$(.github/scripts/image_name.sh base)" >> "$GITHUB_ENV"

    # Keyed to the image rather than the runner: a conan package id does not record
    # which Ubuntu produced a binary, so a cache filled on a runner installs cleanly
    # in the container and then fails at link. The hash is in the fallback prefix
    # too, or the next change to the image restores the previous one's packages.
    #
    # Saved only on main, as in standard_test.yaml: a cache written from a pull
    # request is private to it, and open pull requests together pass the 10 GB
    # limit.
    - name: Restore conan packages
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25  # v5
      with:
        path: ~/.conan2/p
        key: conanp-image-docs-${{ hashFiles('tools/ci/Dockerfile') }}
        # Hash after the suffix, because a restore key is a prefix: with it in the middle
        # nothing could match "this lane, any image", so one Dockerfile line sent the lane
        # cold and it built every dependency from source. 2026-09-08.
        restore-keys: |
          conanp-image-docs-

    # This keeps its cache inside the workspace, which the container mounts at the same
    # path, so what compiles inside the container writes where the runner saves from.
    # CCACHE_DIR is set to match below. Writes only on main, as above.
    - uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639  # v1.2
      with:
        key: docs
        max-size: 1G
        verbose: 1
        save: ${{ github.ref == 'refs/heads/main' }}

    # The documentation is built in the image this repository ships rather than on a
    # runner assembling its own toolchain, so what CI uses is what a developer can
    # run. Pulled when the registry has this Dockerfile's image, built when it does
    # not. The login is allowed to fail: without it the pull misses and the build
    # below runs, which is what happens today anyway.
    # One retry after a wait, as in ci-image.yaml: the archives this pulls from do
    # go quiet, and an immediate second attempt lands inside the same outage.
    - name: Log in to the registry
      continue-on-error: true
      uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1  # v3.5.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Get the image the documentation is built in
      shell: bash
      run: |
        if docker pull --quiet "$SEN_CI_IMAGE"; then
            echo "pulled $SEN_CI_IMAGE"
            exit 0
        fi
        echo "not in the registry, building it"
        build() { docker build --target base --tag "$SEN_CI_IMAGE" tools/ci; }
        build || { echo "image build failed, retrying in 30s"; sleep 30; build; }

    - name: Build the documentation
      shell: bash
      run: |
        .github/scripts/in_image.sh <<'IN'
        export PATH="$HOME/.local/bin:$PATH"
        export CCACHE_DIR="$PWD/.ccache"
        pip install --user --quiet -r docs/requirements.txt
        conan config install .conan/profiles/ --target-folder "$CONAN_HOME/profiles/"
        # A dependency's upstream tarball host going down fails any build with a cold cache.
        # xapian-core, under doxygen, did on 2026-09-08 and blocked the merge queue. Conan
        # tries ConanCenter's mirror of the same sources first, then the origin.
        printf 'core.sources:download_urls=["https://c3i.jfrog.io/artifactory/conan-center-backup-sources/", "origin"]\n' \
            >> "$CONAN_HOME/global.conf"
        # --profile:all names both host and build profile. Copying one over `default`
        # instead is what makes a documented `conan install --profile=...` work here
        # and fail for a reader.
        # Shims for the dependencies only, and the sloppiness with them, as in standard_test.yaml.
        PATH="/usr/lib/ccache:$PATH" \
          CCACHE_SLOPPINESS=clang_index_store,include_file_ctime,include_file_mtime,locale,pch_defines,time_macros \
          conan install . --profile:all=sen_build_docs --build=missing
        cmake --preset=conan-gcc-release
        # The handbook runs the built binaries to capture their command-line help, so
        # these targets pull in the six the snippets depend on.
        cmake --build build/gcc/Release/ --target doxydocs
        cmake --build build/gcc/Release/ --target mkdocs
        IN

    - name: Remove unwanted parts from conan cache before backup
      if: github.ref == 'refs/heads/main'
      shell: bash
      run: |
        .github/scripts/in_image.sh <<'IN'
        conan cache clean "*" -s -b -d -t
        IN

    # After the clean, so build folders stay out. main reaches this through
    # build_docs.yaml, which is what keeps the slice pull requests restore.
    - name: Drop the ccache entry this run replaces
      if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash .github/scripts/drop_cache_key.sh "ccache-docs"

    - name: Drop the entry this save replaces
      if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash .github/scripts/drop_cache_key.sh "conanp-image-docs-${{ hashFiles('tools/ci/Dockerfile') }}"

    - name: Save conan packages
      if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25  # v5
      with:
        path: ~/.conan2/p
        key: conanp-image-docs-${{ hashFiles('tools/ci/Dockerfile') }}
