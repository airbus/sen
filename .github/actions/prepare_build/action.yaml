#
# Everything a lane needs between checking out and building: the conan package
# cache and the toolchain. The nightly lanes each run as their own job, so
# without this the same four steps would be written once per lane and the cache
# keys would drift apart.
#
# Checkout stays with the caller: a local action cannot be resolved before the
# repository is on disk.

name: Prepare a build
description: Restores the conan package cache and installs the toolchain for one lane.

inputs:
  compiler-name:
    description: gcc or clang
    required: true
  compiler-version:
    description: Major version of the compiler
    required: true
  runner-label:
    description: Runner label, which the cache key is built from (for example ubuntu-24.04)
    required: true
  arch:
    description: x86 or arm
    required: false
    default: x86
  std:
    description: C++ standard the cache slice belongs to
    required: false
    default: "17"

outputs:
  cache-key:
    description: >-
      The primary conan cache key this lane asked for, which a restore reports unchanged whether
      it hit, fell back or missed. A job that owns a slice saves under it.
    value: ${{ steps.conan-cache.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    # Restore only, under the key standard_test.yaml and conan.yaml write on a push to main, so a
    # lane reads what a merge already built. No date in the key: drop_cache_key.sh can delete an
    # entry, so a save can replace one.
    #
    # No ccache in any lane reaching this action: the nightly's sanitized and instrumented objects
    # must not mix into the slices the pull-request builds keep, and these lanes compile Sen's
    # tree once per run.
    - name: Restore conan packages
      id: conan-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.conan2/p
        key: conanp-${{ inputs.runner-label }}-${{ inputs.compiler-name }}-${{ inputs.compiler-version }}-${{ inputs.std }}
        restore-keys: conanp-${{ inputs.runner-label }}-${{ inputs.compiler-name }}-${{ inputs.compiler-version }}-

    - name: Setup build context
      uses: ./.github/actions/setup_build_context
      with:
        compiler-name: ${{ inputs.compiler-name }}
        compiler-version: ${{ inputs.compiler-version }}
        arch: ${{ inputs.arch }}
