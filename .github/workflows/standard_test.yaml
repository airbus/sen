name: Standard PR Tests

on:
  workflow_call:
    inputs:
      building-main:
        required: true
        type: boolean

permissions:
  contents: read
  # Deleting the cache entry a save replaces.
  actions: write
  # Reading the image the Linux legs build in, which is a private package.
  packages: read

jobs:
  compute-matrix-jobs:
    name: "Generate build matrix"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      jobs: ${{ steps.compute-jobs.outputs.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: 3.x
      - id: compute-jobs
        run: python .github/scripts/generate_matrix_jobs.py --standard-test ${{ inputs.building-main == true && '--target-main' || '' }}
  build:
    name: "Standard Test Job: ${{ matrix.compiler.name }}-${{ matrix.arch }}-${{ matrix.compiler.version }} C++${{ matrix.std }} [${{ matrix.build_type }}]"
    needs: compute-matrix-jobs
    runs-on: ${{ matrix.runner }}
      # Generous on purpose: a cold cache builds every dependency from
      # source. The cap ends a hang, it does not police duration. Measured
      # 2026-08-20 on a run whose conan cache missed and whose ccache hit 1.3
      # per cent: 20 to 30 minutes, so this is around four times the work. That
      # predates the scoping of the ccache shims, so a cold run should now be
      # faster than the figure this cap was set from.
    timeout-minutes: 120
    strategy:
      # One failing configuration used to cancel the others, so a pull request
      # learned one verdict instead of four and a fix could not be checked until
      # an unrelated one landed.
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.compute-matrix-jobs.outputs.jobs) }}
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
      # What the cached packages were built by. A conan package id does not
      # distinguish one Ubuntu from another, and the image's toolchain is not the
      # runner's even at the same version, so the two must not share an entry.
      SEN_CACHE_SCOPE: ${{ matrix.ci_image != '' && format('image-{0}', matrix.ci_image) || matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # Named once here rather than per step: every step that needs the toolchain
      # runs through in_environment.sh, which uses the image when this is set and
      # the runner when it is not. The Windows and arm legs set nothing.
      - name: Get the image the job builds in
        if: matrix.ci_image != ''
        uses: ./.github/actions/use_ci_image
        with:
          ubuntu: ${{ matrix.ci_image }}

      # Pulled when the registry holds this Dockerfile's image, built when it does
      # not: the tag carries the content, so an edit misses and rebuilds rather than
      # running the previous environment. The build stays for a registry that is
      # missing, unreachable or unauthorised, with one retry for an archive that has
      # gone quiet, as in the other lanes that do this.

      # Dependencies are always Release, so one slice serves the Debug and
      # Release jobs of a compiler alike.
      #
      # Saved only on main, at the end of the job: a cache written from a pull
      # request is private to it, so open pull requests each store the same
      # slice and the repository passes GitHub's 10 GB limit.
      - name: Restore conan packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.conan2/p
          key: conanp-${{ env.SEN_CACHE_SCOPE }}-${{ matrix.compiler.name }}-${{ matrix.compiler.version }}-${{ matrix.std }}

      # On a leg that builds in the image the action has nothing to install and
      # nothing to wrap: the image carries ccache, and cmake wires the launcher
      # inside the container, which writes into the directory in_image.sh mounts.
      # Keeping the directory is all that is left, so that is all this does.
      - name: Restore the compiler cache
        if: matrix.ci_image != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.runner }}-${{ matrix.compiler.name }}-${{ matrix.compiler.version }}-${{ matrix.std }}-${{ matrix.build_type }}

      # Sen's targets reach the cache through CMAKE_<LANG>_COMPILER_LAUNCHER (sen_utils.cmake),
      # so the shims must not also be on PATH while it builds: the launcher would invoke a shim
      # and store every object twice. 631 compile edges drew 1223 ccache calls, run 34117054695.
      # Windows takes sccache because no ccache builds for MSVC. Without one that leg recompiled
      # 860 edges every run: 35.2 minutes of a 36.9 minute job, against 5.4 on gcc [34357828664].
      # The key already carries the runner, so the two variants never share an entry.
      - if: matrix.ci_image == ''
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03  # v1.2.23
        with:
          variant: ${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}
          key: ${{ matrix.runner }}-${{ matrix.compiler.name }}-${{ matrix.compiler.version }}-${{ matrix.std }}-${{ matrix.build_type }}
          max-size: 1G
          verbose: 1
          # Same reasoning as the conan cache above.
          save: ${{ github.ref == 'refs/heads/main' }}

      # Only for a leg that builds on the runner. The image carries the compilers,
      # the system libraries and conan, and its profiles are installed below.
      - name: Setup build context
        if: matrix.ci_image == ''
        uses: ./.github/actions/setup_build_context
        with:
          compiler-name: ${{ matrix.compiler.name }}
          compiler-version: ${{ matrix.compiler.version }}
          arch: ${{ matrix.arch }}

      # What setup_build_context does for a runner leg. The profile is copied over
      # `default` so the conan commands below read the same on either kind of leg,
      # and global.conf carries the source mirror for the same reason it does there:
      # an upstream tarball host going quiet fails any build with a cold cache.
      - name: Install the conan profiles
        if: matrix.ci_image != ''
        shell: bash
        run: |
          bash .github/scripts/in_environment.sh <<'IN'
          conan config install .conan/profiles/ --target-folder "$CONAN_HOME/profiles/"
          cp "$CONAN_HOME/profiles/sen_${{ matrix.compiler.name }}_${{ matrix.arch }}" \
             "$CONAN_HOME/profiles/default"
          printf 'core.sources:download_urls=["https://c3i.jfrog.io/artifactory/conan-center-backup-sources/", "origin"]\n' \
              >> "$CONAN_HOME/global.conf"
          conan profile show -pr default
          IN

      # Built before the compile: a problem with docker or the apt mirror then
      # costs seconds instead of a whole build. The tag carries the base image
      # because the test driver mounts binaries built on that OS into it.
      - name: Build the runtime image for the container-based tests
        if: matrix.runtime_base != ''
        shell: bash
        env:
          BASE: ${{ matrix.runtime_base }}
        run: |
          tag="sen-runtime:${BASE//:/-}"
          docker build --file tools/ci/runtime.Dockerfile \
            --build-arg "BASE=$BASE" --tag "$tag" tools/ci
          echo "SEN_INTEGRATION_TEST_IMAGE=$tag" >> "$GITHUB_ENV"

      # Chocolatey is on the Windows runners already. OpenCppCoverage needs no instrumentation,
      # so it is installed rather than built into the image the Linux legs use.
      - name: Install OpenCppCoverage
        if: ${{ matrix.enable_coverage && matrix.compiler.name == 'msvc' }}
        shell: bash
        run: |
          choco install OpenCppCoverage -y --no-progress
          echo "C:\Program Files\OpenCppCoverage" >> "$GITHUB_PATH"

      - name: Compile base libraries
        shell: bash
        run: |
          bash .github/scripts/in_environment.sh <<'IN'
          # & applies build_type to the sen package only; dependencies stay at
          # the profiles' Release default, which is what binary remotes serve.
          #
          # Dependencies build in their own systems and never see the launcher, so the shims are
          # their only route to ccache; on the conan build below they would be a second one. The
          # sloppiness rides with the launcher, so this route needs its own: conan extracts a
          # dependency's sources just before compiling them, and the default mtime check calls
          # that too new to store.
          if [ "$(uname -s)" = Linux ] && [ ! -x "/usr/lib/ccache/$CXX" ]; then
            echo "::warning::no /usr/lib/ccache/$CXX, so dependency builds are not cached"
          fi
          PATH="/usr/lib/ccache:$PATH" \
          CCACHE_SLOPPINESS=clang_index_store,include_file_ctime,include_file_mtime,locale,pch_defines,time_macros \
          conan install . --lockfile=.conan/conan.lock -s "&:build_type=${{ matrix.build_type }}" \
            -s "&:compiler.cppstd=${{ matrix.std }}" --build=missing \
            -o "sen/*:with_tests=True" \
            -o "sen/*:with_examples=${{ matrix.enable_examples && 'True' || 'False' }}" \
            -o "sen/*:with_coverage=${{ matrix.enable_coverage && matrix.compiler.name != 'msvc' && 'True' || 'False' }}" \
            -o "sen/*:with_release_symbols=${{ matrix.enable_coverage && matrix.compiler.name == 'msvc' && 'True' || 'False' }}"
          # The same options go to both commands: conan build regenerates the toolchain,
          # and without them it would do so from the defaults, which build no tests.
          #
          # with_coverage instruments, which MSVC has no path for; OpenCppCoverage reads the
          # program database instead, and only with_release_symbols makes a Release leg produce
          # one. /Z7 puts that information in the objects, so the compiler cache still stores
          # them -- see the note beside the flag in sen_misc_utils.cmake.
          conan build . --lockfile=.conan/conan.lock -s "&:build_type=${{ matrix.build_type }}" \
            -s "&:compiler.cppstd=${{ matrix.std }}" \
            -o "sen/*:with_tests=True" \
            -o "sen/*:with_examples=${{ matrix.enable_examples && 'True' || 'False' }}" \
            -o "sen/*:with_coverage=${{ matrix.enable_coverage && matrix.compiler.name != 'msvc' && 'True' || 'False' }}" \
            -o "sen/*:with_release_symbols=${{ matrix.enable_coverage && matrix.compiler.name == 'msvc' && 'True' || 'False' }}"
          IN

      # The suite is registered only if the image reached CMake, and its tests
      # are labelled flaky, a selection ctest is allowed to leave empty. A
      # rename on either side of that handoff would otherwise register nothing
      # and still report success.
      - name: Check the container-based tests are registered
        if: matrix.runtime_base != ''
        shell: bash
        run: |
          bash .github/scripts/in_environment.sh <<'IN'
          # Conan provides cmake and ninja; entering its environment is what puts
          # them ahead of whatever else is on PATH, the runner's own copies included.
          source build/${{ matrix.compiler.name }}/${{ matrix.build_type }}/generators/conanbuild.sh
          # Collected first and matched without a pipe: grep -q leaves as soon as it
          # finds one, whatever is writing then dies on the closed pipe, and pipefail
          # makes that the status. The check failed because the test was there.
          registered=$(ctest --test-dir build/${{ matrix.compiler.name }}/${{ matrix.build_type }} \
            -N -L integration)
          grep -q object_sync <<<"$registered"
          IN

      # If the bundle built, the tests must be registered. A rename or a missing tool would drop
      # them and still report success, which is how the baked-docs control went unrun for months.
      - name: Check the gateway tests are registered
        shell: bash
        run: |
          bash .github/scripts/in_environment.sh <<'IN'
          if [ -f apps/mcp_gateway/dist/sen-mcp-gateway.cjs ]; then
            # Same reason as the step above.
            registered=$(ctest --test-dir build/${{ matrix.compiler.name }}/${{ matrix.build_type }} \
              -N -L unit)
            grep -q mcp_gateway_unit <<<"$registered"
          fi
          IN

      # Windows reserves blocks of UDP ports for its own services, and both ether
      # defaults sit in that range, so a bind intermittently fails and the run dies
      # (#52). Below 49152 is outside it. Set here rather than in the step's env,
      # because an expression that evaluates to empty still sets the variable and
      # the component warns on every Linux run about a non-numeric port.
      - name: Move the ether ports out of the range Windows reserves
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          echo "SEN_ETHER_BUS_MULTICAST_PORT=30985" >> "$GITHUB_ENV"
          echo "SEN_ETHER_DISCOVERY_PORT=40543" >> "$GITHUB_ENV"

      # What the container granted, printed on every run rather than inferred from a
      # failure. A feature that needs a permission takes its fallback path without one
      # and the lane goes green over the fallback, which is what this makes visible.
      # Reporting only: nothing here is required yet, and requiring what we do not grant
      # would fail every leg.
      - name: Report what the container granted
        if: ${{ matrix.ci_image != '' }}
        shell: bash
        run: |
          .github/scripts/in_image.sh <<'IN'
          python3 .github/scripts/check_container_capabilities.py
          IN

      - name: Run tests
        # The suite runs in minutes. The bound is for what happens after it: a
        # process outliving ctest holds the pipes, and the step then waits in
        # silence for the whole job budget.
        timeout-minutes: 20
        shell: bash
        env:
          # The suites start sibling containers, so this step needs the daemon.
          # Only the legs that register them ask for it.
          SEN_IN_IMAGE_DOCKER: ${{ matrix.runtime_base != '' && '1' || '' }}
          # MSVC is not instrumented: OpenCppCoverage reads the program database while the suite
          # runs, so it has to be the parent of the test processes rather than follow them.
          SEN_WINDOWS_COVERAGE: ${{ matrix.enable_coverage && matrix.compiler.name == 'msvc' && '1' || '' }}
        run: |
          bash .github/scripts/in_environment.sh <<'IN'
          # The runner is discarded when the job ends, so the testcontainers
          # cleanup helper would only add an image pull.
          export TESTCONTAINERS_RYUK_DISABLED=true
          # Where the sibling containers bind-mount the repository from. The driver
          # otherwise infers it by scanning mountinfo, which reports the mount's root
          # within its filesystem: right on a runner, and on a Mac short by the /Users
          # the desktop's share is rooted at. in_environment.sh mounts the workspace at
          # its own path, so the answer is known rather than inferred.
          export WORKSPACE="$PWD"
          # Same reason as the first of these, in standard_test.yaml. Conan writes
          # .bat rather than .sh on Windows, where cmake takes the generator's path
          # from the cache instead.
          if [ -f build/${{ matrix.compiler.name }}/${{ matrix.build_type }}/generators/conanbuild.sh ]; then
            source build/${{ matrix.compiler.name }}/${{ matrix.build_type }}/generators/conanbuild.sh
          fi
          # What OpenCppCoverage measures and what it leaves out, taken from the list the other
          # compilers read too. It matches against the paths the program database records, which
          # are native and backslash-separated: $PWD here is the POSIX form Git Bash reports and
          # would match nothing, so the workspace comes from the environment and the patterns are
          # rewritten. Written before the cd below, while the list is still a relative path.
          if [ -n "${SEN_WINDOWS_COVERAGE:-}" ]; then
            # Inside the guard: the Linux legs run in the image, which is not given
            # GITHUB_WORKSPACE, and the script runs under set -u.
            workspace="${GITHUB_WORKSPACE:?the Windows legs run on the runner, which sets it}"
            settings="$workspace/opencppcoverage.cfg"
            {
              echo "sources=$workspace"
              sed -e 's/[[:space:]]*$//' -e '/^#/d' -e '/^$/d' -e 's|/|\\|g' \
                  -e 's|^|excluded_sources=|' cmake/util/coverage-exclusions.txt
            } > opencppcoverage.cfg
          fi

          # OpenCppCoverage returns the exit code of what it ran, so a failing suite still fails
          # this step. Every other leg runs the command unwrapped.
          cover() {
            name="$1"
            shift
            if [ -z "${SEN_WINDOWS_COVERAGE:-}" ]; then
              "$@"
              return
            fi
            OpenCppCoverage.exe --quiet --cover_children --config_file="$settings" \
              --export_type="binary:coverage_data/${name}.cov" -- "$@"
          }

          # ctest directly rather than through the run_tests target, which runs
          # these same three commands: on Windows cmake --build does not return
          # once they finish. Keep in step with CMAKE_CTEST_ARGUMENTS in
          # cmake/util/test.cmake.
          cd build/${{ matrix.compiler.name }}/${{ matrix.build_type }}
          mkdir -p coverage_data
          cover parallel ctest --parallel 1 --output-junit ctestParallelReport.xml --no-tests=error \
            --stop-on-failure --output-on-failure --timeout 20 --schedule-random -LE flaky
          cover flaky ctest --repeat until-pass:5 --output-junit ctestFlakyReport.xml --no-tests=ignore \
            --stop-on-failure --output-on-failure --timeout 20 --schedule-random -L flaky
          IN

      # The ctest runs above share one step under -e, so a failing suite ends it and the
      # merge never happened, leaving the publish step below nothing to render exactly
      # when the list of failures is wanted. Merges whichever reports exist.
      - name: Merge the test reports
        if: ${{ always() }}
        shell: bash
        run: |
          bash .github/scripts/in_environment.sh <<'IN'
          cd build/${{ matrix.compiler.name }}/${{ matrix.build_type }}
          set --
          if [ -f ctestParallelReport.xml ]; then set -- "$@" ctestParallelReport.xml; fi
          if [ -f ctestFlakyReport.xml ]; then set -- "$@" ctestFlakyReport.xml; fi
          if [ "$#" -eq 0 ]; then
            echo "no ctest report to merge"
            exit 0
          fi
          junitparser merge "$@" ctestReport.xml
          IN

      # The suite has already run, so these read what it left rather than running it again.
      - name: Collect the coverage the run produced
        if: ${{ matrix.enable_coverage && matrix.compiler.name != 'msvc' }}
        shell: bash
        run: |
          bash .github/scripts/in_environment.sh <<'IN'
          # Same reason as the first of these, in standard_test.yaml.
          source build/${{ matrix.compiler.name }}/${{ matrix.build_type }}/generators/conanbuild.sh
          cmake --build build/${{ matrix.compiler.name }}/${{ matrix.build_type }}/ --target collect-coverage
          IN

      # OpenCppCoverage writes one file per process tree it followed, and the document reads one
      # report per configuration.
      - name: Merge what OpenCppCoverage recorded
        if: ${{ matrix.enable_coverage && matrix.compiler.name == 'msvc' }}
        shell: bash
        run: |
          set --
          for recorded in build/${{ matrix.compiler.name }}/${{ matrix.build_type }}/coverage_data/*.cov; do
            [ -e "$recorded" ] || continue
            set -- "$@" "--input_coverage=$recorded"
          done
          if [ "$#" -eq 0 ]; then
            echo "the suite left no coverage behind, so the leg would report none"
            exit 1
          fi
          OpenCppCoverage.exe --quiet "$@" --export_type="cobertura:build/${{ matrix.compiler.name }}/${{ matrix.build_type }}/coverage_data/coverage.xml"

      # ctest sees one test per vitest package, so without this the document would carry five
      # entries for the hundreds of cases behind them. The runners write their own JUnit into
      # test-reports; this puts those cases where the package entry was.
      - name: Fold the per-case reports in
        if: always()
        shell: bash
        run: |
          bash .github/scripts/in_environment.sh <<'IN'
          directory="build/${{ matrix.compiler.name }}/${{ matrix.build_type }}"
          if [ ! -f "$directory/ctestReport.xml" ]; then
            echo "no ctest report to fold into"
            exit 0
          fi
          python .github/scripts/merge_test_reports.py \
            --report "$directory/ctestReport.xml" \
            --extra-dir "$directory/test-reports" \
            --output "$directory/testReport.xml"
          IN

      # Runs even when the build failed: that is when the report is worth reading.
      # Through the wrapper for the interpreter, not for the file: a leg that builds
      # in the image has no python installed on the runner. The summary is a runner
      # path and is not mounted, so the redirect stays outside.
      - name: Summarise the test results
        if: always()
        shell: bash
        run: |
          bash .github/scripts/in_environment.sh >> "$GITHUB_STEP_SUMMARY" <<'IN'
          directory="build/${{ matrix.compiler.name }}/${{ matrix.build_type }}"
          report="$directory/testReport.xml"
          [ -f "$report" ] || report="$directory/ctestReport.xml"
          python .github/scripts/test_report.py "$report"
          IN

      # The summary above says how many passed; this enumerates which, for QA. typst is in
      # the image, and without it the .typ is still the artifact -- the arrangement
      # sen_generate_typst already uses.
      # Read from the machine that ran the tests, not stated on a command line: a configuration
      # typed by hand is one nobody checks, and this report claimed the wrong architecture and the
      # wrong language standard for a day before the record replaced it.
      - name: Record the test environment
        if: always()
        shell: bash
        run: |
          bash .github/scripts/in_environment.sh <<'IN'
          directory="build/${{ matrix.compiler.name }}/${{ matrix.build_type }}"
          python .github/scripts/record_environment.py \
            --output "$directory/test-environment.tsv" \
            --compiler "${{ matrix.compiler.cxx }}" \
            --build-dir "$directory" \
            --lockfile .conan/conan.lock
          IN

      # What the combined report is built from. The leg renders nothing: one document over
      # every configuration is the record, and five more saying the same thing per build is
      # what it replaced.
      - name: Publish what this leg measured
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # Every leg writes one and a name cannot be written twice, so the fields that
          # tell the jobs apart tell their reports apart.
          name: test-report-${{ matrix.compiler.name }}-${{ matrix.compiler.version }}-${{ matrix.arch }}-cxx${{ matrix.std }}-${{ matrix.build_type }}
          # A leg that failed before the merge has nothing here, and the summary says so.
          if-no-files-found: ignore
          # The document travels with what it was made from: the release attaches the pdf, and
          # the rest is the record a figure in it can be checked against. The mark goes with
          # them because the .typ names it relatively, so a document typeset anywhere but the
          # leg that wrote it cannot resolve the image without it.
          path: |
            build/${{ matrix.compiler.name }}/${{ matrix.build_type }}/ctestReport.xml
            build/${{ matrix.compiler.name }}/${{ matrix.build_type }}/testReport.xml
            build/${{ matrix.compiler.name }}/${{ matrix.build_type }}/test-descriptions.tsv
            build/${{ matrix.compiler.name }}/${{ matrix.build_type }}/test-environment.tsv
            build/${{ matrix.compiler.name }}/${{ matrix.build_type }}/coverage_reports/coverage.txt
            build/${{ matrix.compiler.name }}/${{ matrix.build_type }}/coverage_data/coverage.xml

      # The release workflow attaches this archive and the installer unpacks
      # it, so its layout is a contract. Building it here keeps a dropped
      # install rule from surfacing only at release time.
      - name: Build and check the package archive
        if: matrix.check_package
        shell: bash
        run: |
          bash .github/scripts/in_environment.sh <<'IN'
          # Same reason as the first of these, in standard_test.yaml, and the
          # same .bat/.sh difference as the test step above.
          if [ -f build/${{ matrix.compiler.name }}/${{ matrix.build_type }}/generators/conanbuild.sh ]; then
            source build/${{ matrix.compiler.name }}/${{ matrix.build_type }}/generators/conanbuild.sh
          fi
          cmake --build build/${{ matrix.compiler.name }}/${{ matrix.build_type }}/ --target package
          python .github/scripts/check_package_archive.py build/${{ matrix.compiler.name }}/${{ matrix.build_type }}/
          IN

      # TODO(SEN-1726): Connect App to Airbus Org.
      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4
      #   with:
      #     files: coverage_reports/coverage.lcov
      #     fail_ci_if_error: true
      #     token: ${{ secrets.CODECOV_TOKEN }}

      - name: Remove unwanted parts from conan cache before backup
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          bash .github/scripts/in_environment.sh <<'IN'
          conan cache clean "*" -s -b -d -t
          IN

      # After the clean, so build folders stay out. always() keeps what a
      # cancelled run already built.
      # The prefix has to follow the variant the action used, or the key matches nothing and
      # every merge leaves another copy behind. Windows went unpruned on both counts and
      # reached six entries at 4.8 GB while each Linux lane held one.
      - name: Drop the compiler cache entry this run replaces
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/drop_cache_key.sh "${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}-${{ matrix.runner }}-${{ matrix.compiler.name }}-${{ matrix.compiler.version }}-${{ matrix.std }}-${{ matrix.build_type }}"

      - name: Drop the entry this save replaces
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/drop_cache_key.sh "conanp-${{ env.SEN_CACHE_SCOPE }}-${{ matrix.compiler.name }}-${{ matrix.compiler.version }}-${{ matrix.std }}"

      - name: Save the compiler cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && matrix.ci_image != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.runner }}-${{ matrix.compiler.name }}-${{ matrix.compiler.version }}-${{ matrix.std }}-${{ matrix.build_type }}

      - name: Save conan packages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.conan2/p
          key: conanp-${{ env.SEN_CACHE_SCOPE }}-${{ matrix.compiler.name }}-${{ matrix.compiler.version }}-${{ matrix.std }}

  combined-report:
    name: "Test report for every configuration"
    # Only when every leg succeeded: a configuration missing from the manifest would render a
    # complete-looking report that quietly covers one fewer build.
    needs: [compute-matrix-jobs, build]
    # On pull requests as well as main: the sanitizer job outlasts the whole matrix, so this
    # finishes inside its window and a reviewer can read what a release would ship.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The image the document is typeset in, which is a private package.
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: 3.x

      - name: Take what every leg reported
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: test-report-*
          path: test-reports

      - name: Render one document over every configuration
        shell: bash
        env:
          # head_ref is the source branch on a pull request and empty elsewhere; ref_name on a
          # pull request is the synthetic <number>/merge, which names nothing a reader can fetch.
          SEN_DOC_REF: ${{ github.head_ref || github.ref_name }}
          SEN_DOC_RUN: ${{ github.run_id }}
          # What the matrix said it would run, to check against what arrived.
          SEN_MATRIX: ${{ needs.compute-matrix-jobs.outputs.jobs }}
        run: |
          shopt -s nullglob
          mkdir -p combined

          # Every configuration the matrix ran has to have reported. The upload ignores a leg
          # that produced no files, so one can go missing without failing anything, and a
          # document a build short reads exactly like a complete one.
          found=0
          reported=""
          for leg in test-reports/*/; do
              name=$(basename "$leg")
              name=${name#test-report-}
              if [ ! -f "${leg}testReport.xml" ] && [ ! -f "${leg}ctestReport.xml" ]; then
                  echo "$name produced no test report"
                  exit 1
              fi
              reported="$reported  $name"$'\n'
              found=$((found + 1))
          done
          expected=$(python -c 'import json, os; print(len(json.loads(os.environ["SEN_MATRIX"])))')
          if [ "$found" -ne "$expected" ]; then
              echo "the matrix ran $expected configurations and $found reported:"
              printf '%s' "$reported"
              exit 1
          fi

          # The document reports on what a release publishes, which is a subset of what the
          # matrix tests: clang and arm are run for what they catch, not for what they ship.
          # The release matrix is asked for rather than written down, so the two cannot drift.
          python - <<'PICK' > combined/released.txt
          import sys
          sys.path.insert(0, ".github/scripts")
          from generate_matrix_jobs import compute_jobs
          for job in compute_jobs(release=True, conan=False, standard_test=False, target_main=False):
              print(f"{job.compiler.name}-{job.compiler.version}-{job.arch}-cxx{job.std}-{job.build_type}")
          PICK

          # One line per configuration: its name, the report it wrote, and the records a figure
          # in the document can be checked against.
          manifest=combined/legs.tsv
          : > "$manifest"
          while read -r name; do
              leg="test-reports/test-report-${name}/"
              if [ ! -d "$leg" ]; then
                  echo "$name is published by a release and did not report"
                  exit 1
              fi
              report="${leg}testReport.xml"
              [ -f "$report" ] || report="${leg}ctestReport.xml"
              # cobertura from gcovr and OpenCppCoverage, llvm-cov's table from clang; the
              # renderer reads either and tells them apart by their first character.
              coverage="${leg}coverage_data/coverage.xml"
              [ -f "$coverage" ] || coverage="${leg}coverage_reports/coverage.txt"
              [ -f "$coverage" ] || coverage=""
              printf '%s\t%s\t%s\t%s\t%s\n' "$name" "$report" "$coverage" \
                  "${leg}test-environment.tsv" "${leg}test-descriptions.tsv" >> "$manifest"
          done < combined/released.txt
          python .github/scripts/render_test_document.py \
              "--legs=$manifest" combined/testReport.typ "${{ github.sha }}" . \
              --coverage-floor=80 \
              --logo=docs/assets/images/logo_simple.svg \
              "--ref=$SEN_DOC_REF" \
              "--run=$SEN_DOC_RUN"

      # Only typst needs the image; the render above is stdlib Python and runs on the runner.
      - name: Get the image the document is typeset in
        uses: ./.github/actions/use_ci_image
        with:
          ubuntu: "22.04"

      - name: Typeset it
        run: |
          bash .github/scripts/in_image.sh <<'IN'
          typst compile combined/testReport.typ combined/testReport.pdf
          IN
          [ -s combined/testReport.pdf ] || { echo "typst wrote no pdf"; exit 1; }

      # Not test-report-*: the release collects the legs by that pattern and would read this
      # document as a sixth configuration.
      - name: Publish it
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: combined-test-report
          path: |
            combined/testReport.typ
            combined/testReport.pdf
            combined/legs.tsv
            combined/released.txt
