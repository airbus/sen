name: Standard PR Tests

on:
  workflow_call:
    inputs:
      building-main:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  compute-matrix-jobs:
    name: "Generate build matrix"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      jobs: ${{ steps.compute-jobs.outputs.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: 3.x
      - id: compute-jobs
        run: python .github/scripts/generate_matrix_jobs.py --standard-test ${{ inputs.building-main == true && '--target-main' || '' }}
  build:
    name: "Standard Test Job: ${{ matrix.compiler.name }}-${{ matrix.arch }}-${{ matrix.compiler.version }} C++${{ matrix.std }} [${{ matrix.build_type }}]"
    needs: compute-matrix-jobs
    runs-on: ${{ matrix.runner }}
      # Generous on purpose: a cold cache builds every dependency from
      # source. The cap ends a hang, it does not police duration. Measured
      # 2026-08-20 on a run whose conan cache missed and whose ccache hit 1.3
      # per cent: 20 to 30 minutes, so this is around four times the work.
    timeout-minutes: 120
    strategy:
      # One failing configuration used to cancel the others, so a pull request
      # learned one verdict instead of four and a fix could not be checked until
      # an unrelated one landed.
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.compute-matrix-jobs.outputs.jobs) }}
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate daily cache id
        shell: bash
        run: echo "cache_date=$(/bin/date -u "+%Y%m%d")" >> "$GITHUB_ENV"

      # Dependencies are always Release, so one slice serves the Debug and
      # Release jobs of a compiler alike.
      #
      # Saved only on main, at the end of the job: a cache written from a pull
      # request is private to it, so open pull requests each store the same
      # slice and the repository passes GitHub's 10 GB limit.
      - name: Restore conan packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.conan2/p
          key: conanp-${{ matrix.runner }}-${{ matrix.compiler.name }}-${{ matrix.compiler.version }}-${{ matrix.std }}-${{ env.cache_date }}
          restore-keys: conanp-${{ matrix.runner }}-${{ matrix.compiler.name }}-${{ matrix.compiler.version }}-${{ matrix.std }}-

      - uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03  # v1.2.23
        if: runner.os == 'Linux'
        with:
          key: ${{ matrix.runner }}-${{ matrix.compiler.name }}-${{ matrix.compiler.version }}-${{ matrix.std }}-${{ matrix.build_type }}
          max-size: 1G
          verbose: 1
          # Same reasoning as the conan cache above.
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup build context
        uses: ./.github/actions/setup_build_context
        with:
          compiler-name: ${{ matrix.compiler.name }}
          compiler-version: ${{ matrix.compiler.version }}
          arch: ${{ matrix.arch }}

      - name: Install additional python dependencies
        shell: bash
        run: pip install junitparser==5.0.1

      # Built before the compile: a problem with docker or the apt mirror then
      # costs seconds instead of a whole build. The tag carries the base image
      # because the test driver mounts binaries built on that OS into it.
      - name: Build the runtime image for the container-based tests
        if: matrix.runtime_base != ''
        shell: bash
        env:
          BASE: ${{ matrix.runtime_base }}
        run: |
          pip install docker==7.2.0 testcontainers==4.15.0
          tag="sen-runtime:${BASE//:/-}"
          docker build --file tools/ci/runtime.Dockerfile \
            --build-arg "BASE=$BASE" --tag "$tag" tools/ci
          echo "SEN_INTEGRATION_TEST_IMAGE=$tag" >> "$GITHUB_ENV"

      - name: Compile base libraries
        shell: bash
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"

          # & applies build_type to the sen package only; dependencies stay at
          # the profiles' Release default, which is what binary remotes serve.
          conan install . -s "&:build_type=${{ matrix.build_type }}" \
            -s "&:compiler.cppstd=${{ matrix.std }}" --build=missing \
            -o "sen/*:with_tests=True" \
            -o "sen/*:with_examples=${{ matrix.enable_examples && 'True' || 'False' }}" \
            -o "sen/*:with_coverage=${{ matrix.enable_coverage && 'True' || 'False' }}"
          # The same options go to both commands: conan build regenerates the toolchain,
          # and without them it would do so from the defaults, which build no tests.
          conan build . -s "&:build_type=${{ matrix.build_type }}" \
            -s "&:compiler.cppstd=${{ matrix.std }}" \
            -o "sen/*:with_tests=True" \
            -o "sen/*:with_examples=${{ matrix.enable_examples && 'True' || 'False' }}" \
            -o "sen/*:with_coverage=${{ matrix.enable_coverage && 'True' || 'False' }}"

      # The suite is registered only if the image reached CMake, and its tests
      # are labelled flaky, a selection ctest is allowed to leave empty. A
      # rename on either side of that handoff would otherwise register nothing
      # and still report success.
      - name: Check the container-based tests are registered
        if: matrix.runtime_base != ''
        shell: bash
        run: |
          # Conan provides cmake and ninja; entering its environment is what puts
          # them ahead of whatever else is on PATH, the runner's own copies included.
          source build/${{ matrix.compiler.name }}/${{ matrix.build_type }}/generators/conanbuild.sh
          ctest --test-dir build/${{ matrix.compiler.name }}/${{ matrix.build_type }} \
            -N -L integration | grep -q object_sync

      - name: Run tests
        if: ${{ !matrix.enable_coverage }}
        shell: bash
        # The runner is discarded when the job ends, so the testcontainers
        # cleanup helper would only add an image pull.
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          # Same reason as the first of these, in standard_test.yaml.
          source build/${{ matrix.compiler.name }}/${{ matrix.build_type }}/generators/conanbuild.sh
          cmake --build build/${{ matrix.compiler.name }}/${{ matrix.build_type }}/ --target run_tests

      # The report target runs the suite itself, so this replaces the step above
      # rather than following it. Without it the leg pays for instrumentation
      # and produces no report.
      - name: Run tests and report coverage
        if: matrix.enable_coverage
        shell: bash
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          # Same reason as the first of these, in standard_test.yaml.
          source build/${{ matrix.compiler.name }}/${{ matrix.build_type }}/generators/conanbuild.sh
          cmake --build build/${{ matrix.compiler.name }}/${{ matrix.build_type }}/ \
            --target generate-coverage-report

      # Runs even when the build failed: that is when the report is worth reading.
      - name: Publish the test report
        if: always()
        shell: bash
        run: |
          python .github/scripts/test_report.py \
            "build/${{ matrix.compiler.name }}/${{ matrix.build_type }}/ctestReport.xml" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the coverage report
        if: matrix.enable_coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report
          if-no-files-found: error
          path: build/${{ matrix.compiler.name }}/${{ matrix.build_type }}/coverage_reports/

      # The floor is a few points below what the suite measured on
      # 2026-08-18 (66.74% of lines), so ordinary movement does not fail a
      # pull request while a real drop does. Raise it when coverage rises.
      - name: Show the coverage total and hold the floor
        if: matrix.enable_coverage
        shell: bash
        env:
          MINIMUM_LINE_COVERAGE: "63"
        run: |
          summary="build/${{ matrix.compiler.name }}/${{ matrix.build_type }}/coverage_reports/coverage.txt"
          {
            echo "### Coverage"
            echo '```'
            tail -2 "$summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # llvm-cov's TOTAL row: regions, then functions, then lines, then
          # branches, each as count, missed and percentage.
          lines=$(awk '$1 == "TOTAL" { gsub("%", "", $10); print $10 }' "$summary")
          case "$lines" in
            "" | *[!0-9.]*)
              echo "Could not read the line coverage from $summary; the report format changed."
              exit 1
              ;;
          esac
          echo "line coverage: $lines% (floor $MINIMUM_LINE_COVERAGE%)"
          # Compared as whole percent, so no locale can reinterpret the
          # decimal separator; dropping the fraction only makes it stricter.
          if [ "${lines%%.*}" -lt "$MINIMUM_LINE_COVERAGE" ]; then
              echo "line coverage $lines% is below the $MINIMUM_LINE_COVERAGE% floor"
              exit 1
          fi

      # The release workflow attaches this archive and the installer unpacks
      # it, so its layout is a contract. Building it here keeps a dropped
      # install rule from surfacing only at release time.
      - name: Build and check the package archive
        if: matrix.check_package
        shell: bash
        run: |
          # Same reason as the first of these, in standard_test.yaml.
          source build/${{ matrix.compiler.name }}/${{ matrix.build_type }}/generators/conanbuild.sh
          cmake --build build/${{ matrix.compiler.name }}/${{ matrix.build_type }}/ --target package
          python .github/scripts/check_package_archive.py build/${{ matrix.compiler.name }}/${{ matrix.build_type }}/

      # TODO(SEN-1726): Connect App to Airbus Org.
      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4
      #   with:
      #     files: coverage_reports/coverage.lcov
      #     fail_ci_if_error: true
      #     token: ${{ secrets.CODECOV_TOKEN }}

      - name: Remove unwanted parts from conan cache before backup
        if: always()
        shell: bash
        run: |
          conan cache clean "*" -s -b -d

      # After the clean, so build folders stay out. always() keeps what a
      # cancelled run already built.
      - name: Save conan packages
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.conan2/p
          key: conanp-${{ matrix.runner }}-${{ matrix.compiler.name }}-${{ matrix.compiler.version }}-${{ matrix.std }}-${{ env.cache_date }}
