#
# Lints the pull request title, which becomes the subject of the final squash commit.
# This runs in a dedicated workflow so it can trigger on title updates ('edited' event)
# without forcing the rest of the CI suite to be skipped or re-run.

name: Pull request title check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  merge_group:

permissions:
  contents: read

# A new event cancels the running one.
concurrency:
  group: pr-title-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-title:
    name: "Lint pull request title"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: 3.x
      - name: Install gitlint
        shell: bash
        run: pip install gitlint==0.19.1
      # What a squash merge lands, with the pull request number appended, and the number
      # is why a 71-character subject fails on main and then fails every later pull
      # request [#299]. The repository squashes under the title whatever the commit count
      # (squash_merge_commit_title is PR_TITLE), so reading a lone commit's subject here
      # passed #597 and the merge queue then ejected it on the 78 the title landed.
      - name: Lint what the squash will land
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          printf 'linting the squash subject: %s (#%s)\n' "$PR_TITLE" "$PR_NUMBER"
          printf '%s (#%s)\n' "$PR_TITLE" "$PR_NUMBER" | gitlint
