#
# The address and undefined-behaviour sanitizers, on every pull request. The tree
# is clean under both, so a finding here is a regression the change introduced.
#
# SEN_SANITIZER_FAIL_FAST is what makes it a verdict: ASan aborts on its own, and
# UBSan prints and carries on unless it is told otherwise. The nightly leaves the
# switch off, because there one abort would hide the findings behind it.
#
# The thread sanitizer is deliberately not here. Its lane exists to capture an
# inventory for the concurrency redesign, and gating on defects that work already
# owns would block every pull request over them.

name: Pull request sanitizers

on:
  workflow_call:

permissions:
  contents: read
  # Deleting the cache entry a save replaces.
  actions: write
  # Reading the image this lane runs in, which is a private package.
  packages: read

jobs:
  sanitizers:
    name: "ASan+UBSan"
    runs-on: ubuntu-24.04
    # Generous on purpose, as elsewhere: a cold cache builds every dependency
    # from source. The cap ends a hang, it does not police duration.
    timeout-minutes: 120
    env:
      CC: clang-20
      CXX: clang++-20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # The lane runs in the image this repository builds, so what it uses is the
      # definition a developer can also run rather than a second one assembled on
      # the runner. How it gets there is the action's business.
      - name: Get the image the lane runs in
        uses: ./.github/actions/use_ci_image
        with:
          ubuntu: "22.04"

      # Its own restore rather than prepare_build_in_image's: that one restores and never
      # saves, and this lane saves from main. A cache written from a pull request is private
      # to it, and every open pull request storing its own slice puts the repository past
      # GitHub's 10 GB limit. So this restores always and saves from main only.
      # Keyed to the image, not the runner: a conan package id does not distinguish
      # one Ubuntu from another, and the runner's cache holds 24.04 binaries whose
      # libstdc++ is newer than the image's -- they install here and fail at link.
      - name: Restore conan packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.conan2/p
          key: conanp-image-22.04-clang-20-17-${{ hashFiles('tools/ci/Dockerfile') }}
          # Hash after the suffix, because a restore key is a prefix: with it in the middle
          # nothing could match "this lane, any image", so one Dockerfile line sent the lane
          # cold and it built every dependency from source. 2026-09-08.
          # The second rung is transitional, for the same reason as the documentation lane:
          # every entry written before the base entered the key is 22.04. Remove it once main
          # has written one under the new prefix.
          restore-keys: |
            conanp-image-22.04-clang-20-17-
            conanp-image-clang-20-17-

      # in_image.sh mounts ~/.ccache into the container and cmake wires the launcher, so
      # this lane already compiles through ccache -- it simply never kept the directory,
      # and every run was a cold build of all 953 steps at 25 minutes against 9 for the
      # cached lanes. Its own key: an entry is per lane, and ccache hashes the sanitizer
      # flags, so instrumented objects can neither reach nor be reached by another lane's.
      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-sanitizers-clang-20-17-Debug

      - name: Install the conan profiles
        shell: bash
        run: |
          .github/scripts/in_image.sh <<'IN'
          conan config install .conan/profiles/ --target-folder "$CONAN_HOME/profiles/"
          IN

      # Debug also compiles the SEN_DEBUG_ASSERT invariant checks, which
      # RelWithDebInfo builds leave out.
      - name: Build with the sanitizers
        shell: bash
        run: |
          .github/scripts/in_image.sh <<'IN'
          options='-o sen/*:with_tests=True -o sen/*:sanitizer=address'
          variables="{'SEN_SANITIZER_LOG_DIR': '$PWD/sanitizer-reports', 'SEN_SANITIZER_FAIL_FAST': 'ON'}"
          # --profile:all names both host and build profile. The action this replaced
          # copied one over `default` instead, which is the arrangement that makes a
          # documented `conan install --profile=...` work here and fail for a reader.
          conan install . --profile:all=sen_clang_x86 -s "&:build_type=Debug" --build=missing $options \
            -c "tools.cmake.cmaketoolchain:extra_variables=$variables"
          # conan build regenerates the toolchain, so it needs the same options.
          conan build . --profile:all=sen_clang_x86 -s "&:build_type=Debug" $options \
            -c "tools.cmake.cmaketoolchain:extra_variables=$variables"
          IN

      # A lane that reports nothing looks the same whether it found nothing or looked
      # at nothing, so this fails unless a deliberate finding of each kind reaches the
      # summary. It runs before the suite: a blind lane should say so in seconds.
      - name: Check the sanitizers detect
        shell: bash
        run: |
          .github/scripts/in_image.sh <<'IN'
          # Conan provides cmake and ninja; the check calls ctest, so it needs the same
          # environment the step below does rather than whatever the image ships.
          source build/clang/Debug/generators/conanbuild.sh
          python3 .github/scripts/check_sanitizer_lane.py build/clang/Debug address
          IN

      - name: Run tests
        shell: bash
        run: |
          .github/scripts/in_image.sh <<'IN'
          # Conan provides cmake and ninja; entering its environment is what puts
          # them ahead of whatever else is on PATH, the image's own pair included.
          source build/clang/Debug/generators/conanbuild.sh
          cmake --build build/clang/Debug/ --target run_tests
          IN

      # Always: the findings are what the failure is about, so they have to be
      # reported on the run that failed.
      - name: Report the findings
        if: always()
        shell: bash
        run: |
          # The known-findings list is read on every run, not only once this lane gates, so
          # that an entry which has stopped matching shows up before it is load-bearing.
          python3 .github/scripts/summarise_sanitizer_reports.py sanitizer-reports \
            --known-findings .github/sanitizer-known-findings.json

      - name: Archive the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pr-sanitizer-reports
          path: sanitizer-reports/
          if-no-files-found: ignore

      # Sources and build folders stay out of the entry. conan.yaml also removes the
      # sen recipe first; this lane never exports one, because it installs and builds
      # rather than creating the package, so asking would fail on a missing recipe.
      - name: Clean the conan cache before saving
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          .github/scripts/in_image.sh <<'IN'
          conan cache clean "*" -s -b -d -t
          IN

      - name: Drop the entry this save replaces
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/drop_cache_key.sh "conanp-image-22.04-clang-20-17-${{ hashFiles('tools/ci/Dockerfile') }}"

      # A key that varied per run would leave an entry behind on every merge, which is
      # what took the Windows compiler cache to six entries and 4.8 GB. Fixed key, dropped
      # before the save, because a key is immutable and a save cannot overwrite one.
      - name: Drop the compiler cache entry this run replaces
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/drop_cache_key.sh "ccache-sanitizers-clang-20-17-Debug"

      - name: Save the compiler cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-sanitizers-clang-20-17-Debug

      - name: Save conan packages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.conan2/p
          key: conanp-image-22.04-clang-20-17-${{ hashFiles('tools/ci/Dockerfile') }}
