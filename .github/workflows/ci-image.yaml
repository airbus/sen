name: CI Image

# main.yaml calls this when a change touches the build environment, so that a
# broken image fails the one check the branch protection requires. Cancellation
# and grouping belong to the caller.
#
# The schedule is the other reason this runs. The image floats on ubuntu:22.04
# and on unpinned apt packages, so what it builds changes with the calendar
# rather than with the diff, and merges here are too bursty to be the trigger.
# Off the hour because on-the-hour slots are contended.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "41 7 * * *"

permissions:
  contents: read
  # Pushing the built image. The organisation refuses public packages, not
  # publishing, so the workflow token is enough and no personal token is needed.
  packages: write

env:
  SEN_CI_REGISTRY: ghcr.io/airbus/

jobs:
  build:
    name: "Build and check the image"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Both variants named from one place, so publishing to a registry is one
      # edit in image_name.sh rather than a search for every hardcoded tag.
      - name: Name the images
        shell: bash
        run: |
          {
              echo "SEN_CI_IMAGE_BASE=$(.github/scripts/image_name.sh base)"
              echo "SEN_CI_IMAGE_DEV=$(.github/scripts/image_name.sh dev)"
              echo "SEN_CI_CACHE=$(.github/scripts/image_name.sh buildcache)"
          } >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      # Before the build, not before the push: the layer cache is read from the
      # registry as well, and the package is private so even reading needs this.
      - name: Log in to the registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1  # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Proves the Dockerfile builds, and on main produces what the lanes pull.
      # Only the dev build below exports. dev is built on base, so its export
      # already carries these layers; a second export here would replace that
      # manifest with one the dev build cannot use.
      # The layer cache lives in the registry rather than the Actions cache: it
      # was 2.37 GB of a 10 GB quota that a compiler cache for MSVC needs.
      - name: Build image
        if: github.event_name != 'schedule'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: tools/ci
          file: tools/ci/Dockerfile
          # The Dockerfile's last stage is the editor-facing one; this is the
          # image the pipeline is described against.
          target: base
          push: false
          load: true
          tags: ${{ env.SEN_CI_IMAGE_BASE }}
          cache-from: type=registry,ref=${{ env.SEN_CI_CACHE }}

      # Every layer of the cached build is served from the Actions cache, so it
      # cannot see a dropped package or an unreachable apt.llvm.org. This one
      # imports no cache and exports none, which is the whole point of it.
      # The upstream failures here have all been curl failing to resolve or to
      # connect, and a later run cleared them, so one retry covers them -- but only
      # with a wait: an immediate second attempt lands inside the same outage.
      - name: Build both stages cold
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          build() {
              # dev is built on base, so one cold build covers both stages and
              # the second command only tags the base it has already produced.
              docker buildx build --no-cache --pull --load \
                  --target dev -t "$SEN_CI_IMAGE_DEV" -f tools/ci/Dockerfile tools/ci &&
              docker buildx build --pull --load \
                  --target base -t "$SEN_CI_IMAGE_BASE" -f tools/ci/Dockerfile tools/ci
          }
          build || { echo "cold build failed, retrying in 30s"; sleep 30; build; }

      # Every tool below has been missing at some point, and a missing tool
      # shows up as a check that silently analysed nothing or a configure step
      # that fails on a developer's machine only.
      - name: Check the tools are present
        shell: bash
        run: |
          # The action that installs the toolchain on runners pins the same
          # conan version; the image is the definition, so read it from there.
          conan_version=$(sed -n 's/^ARG CONAN_VERSION=//p' tools/ci/Dockerfile)
          cmake_version=$(sed -n 's/^ARG CMAKE_VERSION=//p' tools/ci/Dockerfile)
          ninja_version=$(sed -n 's/^ARG NINJA_VERSION=//p' tools/ci/Dockerfile)
          test -n "$conan_version" && test -n "$cmake_version" && test -n "$ninja_version"
          docker run --rm "$SEN_CI_IMAGE_BASE" bash -lc '
            set -e
            for tool in conan python3 pip3 ccache git make g++-12 gcc-12 \
                        clang++-20 clang-tidy-20 gcovr lcov genhtml \
                        pytest junitparser bats objdump plantuml typst; do
                command -v "$tool" > /dev/null || { echo "missing: $tool"; exit 1; }
            done
            # The reference typst sets is set in Liberation Sans. Without it the document
            # silently repaginates and the tree connectors stop lining up. A missing font
            # is not a missing command, and there is no fontconfig here to ask, so the
            # check is for the file typst reads.
            test -f /usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf \
                || { echo "missing: Liberation Sans"; exit 1; }
            conan --version | grep -F "'"$conan_version"'"
            python3 -c "import junitparser, pytest"
            # The coverage report target calls these by their versioned names
            # or through the LLVM directory, never from PATH.
            for tool in llvm-profdata llvm-cov; do
                test -x "/usr/lib/llvm-20/bin/$tool" || { echo "missing: $tool"; exit 1; }
            done
            # ccache reaches a dependency build through these masquerade shims and through
            # nothing else. The ccache package creates them by apt trigger, so a compiler
            # installed in a later transaction than ccache silently gets none.
            for shim in gcc-12 g++-12 clang-20 clang++-20; do
                test -x "/usr/lib/ccache/$shim" || { echo "missing shim: $shim"; exit 1; }
            done
            # Coverage and the sanitizers need the clang runtime library, which
            # --no-install-recommends leaves out unless it is asked for.
            printf "int main(){return 0;}" > /tmp/probe.cpp
            clang++-20 -fsanitize=address -o /tmp/probe /tmp/probe.cpp
            # A package built from source in here uses these, so they must report
            # the versions Conan pins rather than merely be present. ninja appends the
            # packager patch level to what it reports, so compare only the release.
            cmake --version | head -1 | grep -Fx "cmake version '"$cmake_version"'"
            test "$(ninja --version | cut -d. -f1-3)" = "'"$ninja_version"'"
            test "$(id -un)" = sen || { echo "image runs as $(id -un)"; exit 1; }
            echo "all expected tools present"
          '

      # The devcontainer builds this stage, and an editor cannot detect a
      # toolchain without these three.
      - name: Build the editor-facing stage
        if: github.event_name != 'schedule'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: tools/ci
          file: tools/ci/Dockerfile
          target: dev
          push: false
          load: true
          tags: ${{ env.SEN_CI_IMAGE_DEV }}
          cache-from: type=registry,ref=${{ env.SEN_CI_CACHE }}
          # Only main writes it: a pull request has no write access to the package,
          # and a fork's token has none at all.
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref={0},mode=min', env.SEN_CI_CACHE) || '' }}

      - name: Check the editor tools are present
        shell: bash
        run: |
          docker run --rm "$SEN_CI_IMAGE_DEV" bash -lc '
            set -e
            for tool in cmake ninja gdb dot; do
                command -v "$tool" > /dev/null || { echo "missing: $tool"; exit 1; }
            done
            # Conan writes CMakeUserPresets.json at version 4, which needs at
            # least cmake 3.23; the distribution ships 3.22.
            cmake --version | head -1
            printf "%s\n" "$(cmake --version | head -1 | grep -oE "[0-9]+\.[0-9]+")" |
                awk -F. "{ exit (\$1 > 3 || (\$1 == 3 && \$2 >= 23)) ? 0 : 1 }"
            test "$(id -un)" = sen || { echo "image runs as $(id -un)"; exit 1; }
            echo "editor tools present"
          '

      # After the checks, never as part of the build: an image that fails them
      # must not become the one every lane pulls. Only from main -- a pull request
      # cannot write the package, and the tag carries the Dockerfile's content, so
      # a schedule run republishes the current one against the day's packages.
      # TEMPORARY, remove before merge. Proves the workflow token can push through
      # the workflow_call chain from main.yaml, which is the one thing local testing
      # cannot reach. A throwaway reference on purpose: the real tag carries the
      # Dockerfile's content, this branch does not change it, so publishing the real
      # tag from here would overwrite exactly what every lane pulls.
      - name: Publish a throwaway tag from this branch
        if: github.ref != 'refs/heads/main'
        shell: bash
        env:
          PROBE_REF: ghcr.io/airbus/sen-ci:probe-from-branch
        run: |
          docker tag "$SEN_CI_IMAGE_BASE" "$PROBE_REF"
          docker push "$PROBE_REF"
          echo "pushed $PROBE_REF"

      - name: Publish the images
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          docker push "$SEN_CI_IMAGE_BASE"
          docker push "$SEN_CI_IMAGE_DEV"
          echo "published $SEN_CI_IMAGE_BASE and $SEN_CI_IMAGE_DEV"
