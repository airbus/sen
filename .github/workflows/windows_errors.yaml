# Throwaway. Builds the Windows test tree with ninja set to keep going, so one run
# reports every failure instead of the first. Delete once the list is acted on.
name: Windows errors

on:
  push:
    branches: [ci/what-breaks-on-windows]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  errors:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CC: cl
      CXX: cl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup_build_context
        with:
          compiler-name: msvc
          compiler-version: 194
          arch: x86

      # conan install generates the presets; it does not configure. conan build
      # would do both but calls cmake.build() with no way to pass ninja a flag.
      - name: Install dependencies
        shell: bash
        run: |
          conan install . -s "&:build_type=Release" -s "&:compiler.cppstd=17" \
            --build=missing -o "sen/*:with_tests=True" -o "sen/*:with_examples=True"

      # cmd, and conanbuild.bat first: cl is only on PATH inside the Visual Studio
      # environment, which conan build sets up and a bare cmake call does not.
      # -k 0 so every target is attempted rather than stopping at the first.
      - name: Build, keeping going
        shell: cmd
        run: |
          call build\msvc\Release\generators\conanbuild.bat
          cmake --preset conan-msvc-release
          cmake --build build\msvc\Release -- -k 0 > build.log 2>&1
          type build.log
          exit /b 0

      - name: Check the build actually ran
        shell: bash
        run: |
          grep -qE "\[[0-9]+/[0-9]+\]" build.log || {
              echo "no ninja progress lines: the build never started" >&2
              exit 1
          }
          grep -oE "\[[0-9]+/[0-9]+\]" build.log | tail -1 | sed 's/^/reached /'

      - name: The list
        shell: bash
        run: |
          n=$(grep -cE "error C[0-9]{4}" build.log || true)
          w=$(grep -cE "warning C[0-9]{4}" build.log || true)
          echo "MSVC error lines: $n"
          echo "MSVC warning lines: $w"
          if [ "$n" -gt 0 ]; then
              echo "--- distinct error codes ---"
              grep -oE "error C[0-9]{4}" build.log | sort | uniq -c | sort -rn
              echo "--- distinct failing lines ---"
              grep -oE "[^ ]+\([0-9]+[,0-9]*\) ?: (fatal )?error C[0-9]{4}: .*" build.log | sort -u
          fi
          # gcc and clang build with -Werror; MSVC has /W3 and no /WX, so these are
          # ignored there. Listed so they can be cleared before /WX is considered.
          if [ "$w" -gt 0 ]; then
              echo "--- distinct warning codes ---"
              grep -oE "warning C[0-9]{4}" build.log | sort | uniq -c | sort -rn
              echo "--- one example of each code ---"
              grep -oE "warning C[0-9]{4}: [^\r]*" build.log | sort -u -t: -k1,1 | head -40
              echo "--- files with the most warnings ---"
              grep -oE "^[A-Za-z]:[^(]+\([0-9]+" build.log | sed 's/(.*//' | sort | uniq -c | sort -rn | head -20
          fi

      # run_tests passes --stop-on-failure, which reports the first failure and
      # hides the rest. This is the same selection without it.
      - name: Run every test
        shell: cmd
        run: |
          call build\msvc\Release\generators\conanbuild.bat
          ctest --test-dir build\msvc\Release --parallel 1 --timeout 20 --schedule-random -LE flaky --output-on-failure > tests.log 2>&1
          exit /b 0

      - name: The failures
        shell: bash
        run: |
          grep -E "tests passed|tests failed out of" tests.log || true
          echo "--- failed tests ---"
          sed -n '/The following tests FAILED/,$p' tests.log || true

      # The suite passes and the target still does not return. The last thing it
      # prints is the flaky pass starting, and that selection is empty here because
      # every flaky test is a container one and those are added under if(LINUX).
      # The same command against an empty selection prints one line and exits at
      # once on Linux. This runs it alone to say whether that is what hangs.
      - name: The flaky pass on its own
        shell: cmd
        timeout-minutes: 3
        run: |
          call build\msvc\Release\generators\conanbuild.bat
          ctest --test-dir build\msvc\Release -N -L flaky
          echo SELECTION-COUNTED
          ctest --test-dir build\msvc\Release --parallel 1 --repeat until-pass:5 ^
            --output-junit ctestFlakyReport.xml --no-tests=ignore --output-on-failure ^
            --timeout 20 --stop-on-failure -L flaky
          echo FLAKY-PASS-RETURNED

      # Whatever is still alive here is what the target is waiting on.
      - name: What is still running
        if: always()
        shell: cmd
        run: |
          tasklist /fi "imagename eq sen.exe"
          tasklist /fi "imagename eq node.exe"
          tasklist /fi "imagename eq python.exe"
          tasklist /fi "imagename eq ctest.exe"
          exit /b 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: windows-build-log
          path: |
            build.log
            tests.log
          if-no-files-found: ignore
