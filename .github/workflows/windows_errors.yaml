# Throwaway. Builds the Windows test tree with ninja set to keep going, so one run
# reports every failure instead of the first. Delete once the list is acted on.
name: Windows errors

on:
  push:
    branches: [ci/what-breaks-on-windows]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  errors:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CC: cl
      CXX: cl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup_build_context
        with:
          compiler-name: msvc
          compiler-version: 194
          arch: x86

      # conan install generates the presets; it does not configure. conan build
      # would do both but calls cmake.build() with no way to pass ninja a flag.
      - name: Configure
        shell: bash
        run: |
          conan install . -s "&:build_type=Release" -s "&:compiler.cppstd=17" \
            --build=missing -o "sen/*:with_tests=True"
          cmake --preset conan-msvc-release

      # -k 0 so every target is attempted. Not continue-on-error: a build that
      # fails to start must not read as a build with no errors.
      - name: Build, keeping going
        shell: bash
        run: |
          set -o pipefail
          cmake --build build/msvc/Release -- -k 0 2>&1 | tee build.log || true
          grep -qE "\[[0-9]+/[0-9]+\]" build.log || {
              echo "no ninja progress lines: the build never started" >&2
              exit 1
          }
          tail -1 <(grep -oE "\[[0-9]+/[0-9]+\]" build.log) | sed 's/^/reached /'

      - name: The list
        shell: bash
        run: |
          n=$(grep -cE "error C[0-9]{4}" build.log || true)
          echo "MSVC error lines: $n"
          if [ "$n" -gt 0 ]; then
              echo "--- distinct codes ---"
              grep -oE "error C[0-9]{4}" build.log | sort | uniq -c | sort -rn
              echo "--- distinct failing lines ---"
              grep -oE "[^ ]+\([0-9]+[,0-9]*\) ?: (fatal )?error C[0-9]{4}: .*" build.log | sort -u
              echo "--- files ---"
              grep -oE "^[A-Za-z]:[^(]+\(" build.log | sed 's/($//' | sort -u | head -40
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: windows-build-log
          path: build.log
          if-no-files-found: ignore
