# Throwaway. Builds the Windows test tree with ninja set to keep going, so one run
# reports every failure instead of the first. Delete once the list is acted on.
name: Windows errors

on:
  push:
    branches: [ci/what-breaks-on-windows]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  errors:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CC: cl
      CXX: cl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup_build_context
        with:
          compiler-name: msvc
          compiler-version: 194
          arch: x86

      - name: Configure
        shell: bash
        run: |
          conan install . -s "&:build_type=Release" -s "&:compiler.cppstd=17" \
            --build=missing -o "sen/*:with_tests=True"

      # -k 0 rather than conan build, which calls cmake.build() with no way to pass
      # it through. Never fails: the errors are the output.
      - name: Build, keeping going
        shell: bash
        continue-on-error: true
        run: |
          preset=$(python -c "import json;print(json.load(open('CMakeUserPresets.json'))['include'][0])")
          dir=$(python -c "import json,sys;p=json.load(open(sys.argv[1]));print(p['configurePresets'][0]['binaryDir'])" "$preset")
          echo "building in $dir"
          cmake --build "$dir" -- -k 0 2>&1 | tee build.log

      - name: The list
        shell: bash
        run: |
          echo "distinct error codes:"
          grep -oE "error C[0-9]{4}" build.log | sort | uniq -c | sort -rn
          echo
          echo "distinct failing lines:"
          grep -oE "[^ ]+\([0-9]+[,0-9]*\) ?: (fatal )?error C[0-9]{4}: .*" build.log | sort -u
          echo
          echo "files affected:"
          grep -oE "^[A-Za-z]:[^(]+" build.log | sort -u | head -40

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: windows-build-log
          path: build.log
          if-no-files-found: ignore
