name: Conan CI

on:
  workflow_call:
    inputs:
      push_artifacts:
        required: false
        default: false
        type: boolean
      # Pull requests package the shipping configuration only; see main.yaml.
      pull_request_subset:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  compute-matrix-jobs:
    name: "Generate build matrix"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      jobs: ${{ steps.compute-jobs.outputs.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: 3.x
      - id: compute-jobs
        run: python .github/scripts/generate_matrix_jobs.py --conan ${{ inputs.pull_request_subset && '--pull-request' || '' }}
  build:
    name: "Conan Job: ${{ matrix.compiler.name }}-${{ matrix.arch }}-${{ matrix.compiler.version }} C++${{ matrix.std }} [${{ matrix.build_type }}]"
    needs: compute-matrix-jobs
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      # Same reason as standard_test.yaml.
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.compute-matrix-jobs.outputs.jobs) }}
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # Same key scheme as standard_test.yaml so both workflows share one
      # dependency slice per compiler (dependencies are always Release), and
      # the same save-only-on-main split, for the same reason.
      - name: Restore conan packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.conan2/p
          key: conanp-${{ matrix.runner }}-${{ matrix.compiler.name }}-${{ matrix.compiler.version }}-${{ matrix.std }}

      - name: Setup build context
        uses: ./.github/actions/setup_build_context
        with:
          compiler-name: ${{ matrix.compiler.name }}
          compiler-version: ${{ matrix.compiler.version }}
          arch: ${{ matrix.arch }}

      - name: Create conan package
        shell: bash
        run: |
          # build_type applies to the sen package only; dependencies stay at
          # the profiles' Release default, shared across build types and
          # matching what binary remotes serve. Scoped by name rather than &
          # because the test_package graph has a different consumer.
          conan create . --user airbus --channel dev --lockfile-out=package.lock \
              --test-folder .conan/test_packages/package \
              --build=missing -s "sen/*:build_type=${{ matrix.build_type }}"

      - name: Push conan packages
        if: ${{ inputs.push_artifacts }}
        shell: bash
        run: echo "Pushing package (fake entry)"

      - name: Remove unwanted parts from conan cache before backup
        if: always()
        shell: bash
        run: |
          conan remove sen --confirm
          conan cache clean "*" -s -b -d

      # After the clean, so sen itself and the build folders stay out.
      - name: Drop the entry this save replaces
        if: always() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/drop_cache_key.sh "conanp-${{ matrix.runner }}-${{ matrix.compiler.name }}-${{ matrix.compiler.version }}-${{ matrix.std }}"

      - name: Save conan packages
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.conan2/p
          key: conanp-${{ matrix.runner }}-${{ matrix.compiler.name }}-${{ matrix.compiler.version }}-${{ matrix.std }}
