#
# Lanes that are too slow for the pull-request path. A failing lane files or
# refreshes the tracking issue instead of failing silently overnight.
#
# Each lane checks out, calls .github/actions/prepare_build for the cache and
# the toolchain, and then does its own work.
#
# The timeouts are generous on purpose: a cold cache builds every dependency
# from source. They exist to cap a hang, not to police duration.

name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitizers:
    name: "${{ matrix.lane }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: "TSan"
            sanitizer: thread
          - lane: "ASan+UBSan"
            sanitizer: address
    env:
      CC: clang-20
      CXX: clang++-20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare the build
        uses: ./.github/actions/prepare_build
        with:
          compiler-name: clang
          compiler-version: 20
          runner-label: ubuntu-24.04

      - name: Install additional python dependencies
        shell: bash
        run: pip install junitparser==5.0.1 docker==7.2.0 testcontainers==4.15.0

      # The container suites are the only tests that cross a process boundary, and no
      # sanitizer lane has ever registered them. conanfile.py reads this variable and
      # hands it to CMake, which is what libs/kernel/test/CMakeLists.txt gates on.
      # BASE tracks the runner: the image runs the binaries built here.
      - name: Build the runtime image for the container-based tests
        shell: bash
        run: |
          docker build --file tools/ci/runtime.Dockerfile \
            --build-arg "BASE=ubuntu:24.04" --tag "sen-runtime:ubuntu-24.04" tools/ci
          echo "SEN_INTEGRATION_TEST_IMAGE=sen-runtime:ubuntu-24.04" >> "$GITHUB_ENV"

      # Debug also compiles the SEN_DEBUG_ASSERT invariant checks, which
      # RelWithDebInfo builds leave out.
      - name: Build with ${{ matrix.lane }}
        shell: bash
        run: |
          conan install . -s "&:build_type=Debug" --build=missing \
            -o "sen/*:with_tests=True" \
            -o "sen/*:sanitizer=${{ matrix.sanitizer }}" \
            -c "tools.cmake.cmaketoolchain:extra_variables={'SEN_SANITIZER_LOG_DIR': '$PWD/sanitizer-reports'}"
          # conan build regenerates the toolchain, so it needs the same options.
          conan build . -s "&:build_type=Debug" \
            -o "sen/*:with_tests=True" \
            -o "sen/*:sanitizer=${{ matrix.sanitizer }}" \
            -c "tools.cmake.cmaketoolchain:extra_variables={'SEN_SANITIZER_LOG_DIR': '$PWD/sanitizer-reports'}"

      # Without this the lane cannot tell having found nothing from having looked at
      # nothing, which is the state it has been in: no thread report has ever been
      # uploaded. Fails unless a deliberate finding reaches the summary.
      - name: Check the sanitizers detect
        shell: bash
        run: |
          # Same reason as the "Run tests" step below: the check calls ctest, which comes
          # from Conan rather than from the runner.
          source build/clang/Debug/generators/conanbuild.sh
          python3 .github/scripts/check_sanitizer_lane.py build/clang/Debug ${{ matrix.sanitizer }}

      - name: Run tests
        shell: bash
        run: |
          # Same reason as the first of these, in standard_test.yaml.
          source build/clang/Debug/generators/conanbuild.sh
          cmake --build build/clang/Debug/ --target run_tests

      # The container suites run as root and write their reports into the mounted tree, where
      # the runner cannot read them. The summary lists those as unreadable and still exits
      # clean; the upload fails on the first one.
      - name: Take ownership of the reports the containers wrote
        if: always()
        shell: bash
        run: |
          [ -d sanitizer-reports ] || exit 0
          sudo chown -R "$(id -u):$(id -g)" sanitizer-reports

      # Always: a run that failed for an unrelated reason still collected them.
      - name: Report the ${{ matrix.lane }} findings
        if: always()
        shell: bash
        run: |
          python3 .github/scripts/summarise_sanitizer_reports.py sanitizer-reports \
            --known-findings .github/sanitizer-known-findings.json

      - name: Archive the ${{ matrix.lane }} reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sanitizer-reports-${{ matrix.sanitizer }}
          path: sanitizer-reports/
          if-no-files-found: ignore

  # Inside the image, which D-2026-09-03d asks for and which is also what puts the clang-tidy
  # cache on the path: sen_utils.cmake picks it up by name and no runner carries one.
  clang-tidy:
    name: "clang-tidy (targets that opted in)"
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      # Reading the image, which is a private package.
      packages: read
      # Deleting the cache entry a save replaces.
      actions: write
    env:
      SEN_CI_REGISTRY: ghcr.io/airbus/
      BUILD_DIR: build/clang/Release
      CC: clang-20
      CXX: clang++-20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Name the image
        shell: bash
        run: echo "SEN_CI_IMAGE=$(.github/scripts/image_name.sh base 24.04)" >> "$GITHUB_ENV"

      # Keyed to the image rather than the runner, for the reason pr_sanitizers.yaml gives: a
      # conan package id does not tell one Ubuntu from another, and the runner's libstdc++ is
      # newer than the image's, so its binaries install here and fail at link.
      - name: Restore conan packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.conan2/p
          key: conanp-image-24.04-clang-20-17-${{ hashFiles('tools/ci/Dockerfile') }}
          restore-keys: |
            conanp-image-24.04-clang-20-17-

      # One empty file per analysed unit, touched on every hit, so age is a least-recently-used
      # order and the prune below is what bounds it. Under .cache, which is already ignored, and
      # inside the workspace so the container reaches it through the mount it already has.
      - name: Restore the clang-tidy cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/ctcache
          key: ctcache-clang-20-17-Release

      - name: Log in to the registry
        continue-on-error: true
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1  # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get the image the lane runs in
        shell: bash
        run: |
          if docker pull --quiet "$SEN_CI_IMAGE"; then
              echo "pulled $SEN_CI_IMAGE"
              exit 0
          fi
          echo "not in the registry, building it"
          args=()
          while IFS= read -r a; do args+=(--build-arg "$a"); done \
              < <(.github/scripts/image_build_args.sh 24.04)
          build() { docker build --target base --tag "$SEN_CI_IMAGE" "${args[@]}" tools/ci; }
          build || { echo "image build failed, retrying in 30s"; sleep 30; build; }

      - name: Install the conan profiles
        shell: bash
        run: |
          .github/scripts/in_image.sh <<'IN'
          conan config install .conan/profiles/ --target-folder "$CONAN_HOME/profiles/"
          IN

      # ninja -k 0 rather than conan build: analysis is opt-in per target and a finding fails the
      # compile, so stopping at the first one reported one violation a night. GITHUB_WORKSPACE is
      # not forwarded into the container; $PWD is the same directory.
      - name: Analyse with clang-tidy
        shell: bash
        run: |
          .github/scripts/in_image.sh <<'IN'
          export CTCACHE_DIR="$PWD/.cache/ctcache"
          options='-o sen/*:with_tests=True -o sen/*:with_clang_tidy=True'
          conan install . --profile:all=sen_clang_x86 -s "&:build_type=Release" --build=missing $options
          source build/clang/Release/generators/conanbuild.sh
          cmake --preset conan-clang-release
          ninja -C build/clang/Release -k 0
          IN

      # A lane that caches nothing looks exactly like one that caches everything, so say which.
      - name: Report the cache size
        if: always()
        shell: bash
        run: |
          printf 'cached results: %s\n' "$(find .cache/ctcache -type f 2>/dev/null | wc -l | tr -d ' ')"

      # The cache only grows: a hit refreshes the file's timestamp, and nothing removes the
      # entries that stop being hit.
      - name: Prune the entries nothing has asked for
        if: ${{ !cancelled() }}
        shell: bash
        run: find .cache/ctcache -type f -mtime +14 -delete 2>/dev/null || true

      - name: Drop the entry this save replaces
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/drop_cache_key.sh "ctcache-clang-20-17-Release"

      - name: Save the clang-tidy cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/ctcache
          key: ctcache-clang-20-17-Release

  flake-hunt:
    name: "Unit test repeat loop"
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CC: gcc-12
      CXX: g++-12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare the build
        uses: ./.github/actions/prepare_build
        with:
          compiler-name: gcc
          compiler-version: 12
          runner-label: ubuntu-22.04

      - name: Install additional python dependencies
        shell: bash
        run: pip install junitparser==5.0.1

      - name: Build
        shell: bash
        run: |
          conan install . -s "&:build_type=Release" --build=missing -o "sen/*:with_tests=True"
          conan build . -s "&:build_type=Release" -o "sen/*:with_tests=True"

      # An intermittent test is a defect: this loop exists to catch it, not
      # to retry it away.
      - name: Repeat the unit suite until a failure
        shell: bash
        run: |
          # Same reason as the first of these, in standard_test.yaml.
          source build/gcc/Release/generators/conanbuild.sh
          ctest --test-dir build/gcc/Release --parallel "$(nproc)" \
              -L unit -LE flaky --repeat until-fail:5 --output-on-failure

      - name: Archive test logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: flake-hunt-logs
          path: build/gcc/Release/Testing/

  benchmarks:
    name: "Benchmarks"
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CC: gcc-12
      CXX: g++-12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare the build
        uses: ./.github/actions/prepare_build
        with:
          compiler-name: gcc
          compiler-version: 12
          runner-label: ubuntu-22.04

      - name: Build benchmarks
        shell: bash
        run: |
          conan install . -s "&:build_type=Release" --build=missing
          conan build . -s "&:build_type=Release"

      - name: Run benchmarks
        shell: bash
        run: |
          # Same reason as the first of these, in standard_test.yaml.
          source build/gcc/Release/generators/conanbuild.sh
          cmake --build build/gcc/Release/ --target run_benchmarks

      # Result history lives in these artifacts until a baseline comparison
      # exists to fail on.
      - name: Archive benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: benchmark-results
          # An empty archive would mean the benchmarks never ran, which is the
          # kind of quiet nothing this pipeline is not supposed to allow.
          if-no-files-found: error
          path: build/gcc/Release/**/*_benchmark*.json

  pre-commit-full:
    name: "pre-commit full tree"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: 3.x
      # The pull-request job checks only changed files; this sweep catches
      # violations that arrive with hook or rule updates.
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1
        with:
          extra_args: --all-files

  # Catches documentation breakage from paths the pull-request gate does not
  # watch, for example doxygen comments in headers.
  docs-build:
    uses: ./.github/workflows/docs_check.yaml
    permissions:
      contents: read
      actions: write
      # docs_check.yaml pulls the image it builds in. A called workflow cannot request
      # more than this grants, and the whole nightly fails at startup when it does.
      packages: read

  # Every packaged configuration, which a pull request does not run: it builds
  # only the configuration that ships.
  packaging:
    uses: ./.github/workflows/conan.yaml
    # A called workflow cannot hold more than its caller grants, and this one
    # drops the cache entry its save replaces. Without this the whole nightly
    # fails to start, with no jobs and nothing in the log to say why.
    permissions:
      contents: read
      actions: write
      # And its Linux legs pull the image they build in.
      packages: read

  # Sen promises consumers "at least C++17", and they compile its headers in
  # their own dialect. Building Sen itself at C++20 compiles those headers the
  # way a C++20 consumer would; the dependencies keep their own standard, so
  # this costs one build and no dependency rebuild.
  cppstd-20:
    name: "Public headers under C++20"
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CC: gcc-12
      CXX: g++-12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare the build
        uses: ./.github/actions/prepare_build
        with:
          compiler-name: gcc
          compiler-version: 12
          runner-label: ubuntu-22.04

      - name: Build the package and its consumer with C++20 headers
        shell: bash
        run: |
          conan create . --user airbus --channel dev \
              --test-folder .conan/test_packages/package \
              --build=missing -s "sen/*:compiler.cppstd=20"

  # Pull requests build with gcc-12, the oldest compiler the project supports.
  # A newer release rejects code the older one accepts and warns about more, so
  # the whole tree, examples and tests included, is compiled once a day with the
  # newest gcc available on a runner.
  #
  # The same lane then checks the promise the project makes to consumers: they
  # get "at least C++17" and compile these headers in their own dialect. The
  # package is created the way it is released, at C++17, and the small consumer
  # under .conan/test_packages is then compiled against it once per newer
  # standard. Only the consumer's standard changes, so nothing is rebuilt.
  newest-compiler:
    name: "Newest gcc and newer consumer standards"
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      # Dropping the cache entry the save below replaces.
      actions: write
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare the build
        id: prepare
        uses: ./.github/actions/prepare_build
        with:
          compiler-name: gcc
          compiler-version: 14
          runner-label: ubuntu-24.04

      - name: Build the whole tree with the newest gcc
        shell: bash
        run: |
          conan create . --user airbus --channel dev \
              --test-folder .conan/test_packages/package \
              --build=missing -s "sen/*:compiler.cppstd=17" \
              -o "sen/*:with_tests=True" -o "sen/*:with_examples=True"

      - name: Compile the consumer under newer standards
        shell: bash
        run: |
          version=$(conan inspect . --format=json |
              python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])')
          for std in 20 23; do
              echo "::group::consumer at C++$std"
              # The bare setting reaches the consumer, the patterns hold sen and its
              # dependencies at what they were built with. "&:" would not: under conan
              # test it names the package under test.
              conan test .conan/test_packages/package "sen/$version@airbus/dev" \
                  -s "compiler.cppstd=$std" -s "*:compiler.cppstd=17" \
                  -o "sen/*:with_tests=True" -o "sen/*:with_examples=True"
              echo "::endgroup::"
          done

      # No merge-path leg builds gcc-14, so this job owns its slice. conan create leaves Sen's
      # sources and build folders behind, and none of that can serve a restore.
      #
      # sen/* because the bare name raises when the recipe is absent; -t because conan leaves a
      # failed build's folders out of its database, where no other flag reaches them.
      - name: Remove unwanted parts from the conan cache before saving
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          conan remove "sen/*" --confirm
          conan cache clean "*" -s -b -d -t

      # A key is immutable, so while the old entry exists the save is refused, quietly, and the
      # slice would never refresh. Neither step runs unless the restore succeeded and the run was
      # not cancelled: the delete would land and the upload would not.
      - name: Drop the entry this save replaces
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/drop_cache_key.sh "${{ steps.prepare.outputs.cache-key }}"

      - name: Save conan packages
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.conan2/p
          key: ${{ steps.prepare.outputs.cache-key }}

  # The pull-request pipeline measures coverage and gates on it, but keeps the report as
  # a run artifact, which nobody looks at. Measuring here once a day is what gives the
  # report a stable home to be published from.
  coverage:
    name: "Coverage report"
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CC: clang-20
      CXX: clang++-20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare the build
        uses: ./.github/actions/prepare_build
        with:
          compiler-name: clang
          compiler-version: 20
          runner-label: ubuntu-24.04

      - name: Install additional python dependencies
        shell: bash
        run: pip install junitparser==5.0.1

      # The report target runs the suite as it measures it.
      - name: Build and measure
        shell: bash
        run: |
          conan install . -s "&:build_type=Debug" -s "&:compiler.cppstd=17" --build=missing \
            -o "sen/*:with_tests=True" -o "sen/*:with_coverage=True"
          conan build . -s "&:build_type=Debug" -s "&:compiler.cppstd=17" \
            -o "sen/*:with_tests=True" -o "sen/*:with_coverage=True"
          # Same reason as the first of these, in standard_test.yaml.
          source build/clang/Debug/generators/conanbuild.sh
          cmake --build build/clang/Debug/ --target generate-coverage-report

      - name: Publish the coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report
          if-no-files-found: error
          path: build/clang/Debug/coverage_reports/

  # Kept apart from the job above so that the build never holds a token that
  # can write to the repository.
  publish-coverage:
    name: "Publish the report to the documentation site"
    needs: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    # build_docs.yaml uses this group as well, so a deploy queues behind
    # another instead of racing it; the loser of a race is rejected.
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - name: Check the documentation site exists
        id: site
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/branches/gh-pages" > /dev/null 2>&1; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
          else
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "::notice::The documentation has never been published, so there is no site to publish the report into."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.site.outputs.exists == 'true'
        with:
          ref: gh-pages
          fetch-depth: 1

      # Downloaded outside the checkout, so that replaying the change on top
      # of a documentation deploy does not need the report to survive a reset.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        if: steps.site.outputs.exists == 'true'
        with:
          name: coverage-report
          path: ${{ runner.temp }}/incoming

      # mike owns the versioned directories; this one sits beside them and it
      # is served at <site>/coverage/.
      - name: Replace the published report
        if: steps.site.outputs.exists == 'true'
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/incoming
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          # A documentation deploy can land between the checkout and the push.
          # Losing that race is normal, so take the site as it now stands and
          # put the report back on top rather than merging histories: this
          # branch is a published directory, not a line of development.
          for attempt in 1 2 3; do
              rm -rf coverage
              mkdir coverage
              cp -R "$REPORT"/. coverage/

              git add --all coverage
              if git diff --cached --quiet; then
                  echo "the report has not changed"
                  exit 0
              fi
              git commit --quiet --message "docs: refresh the coverage report"

              if git push origin HEAD:gh-pages; then
                  exit 0
              fi
              echo "gh-pages moved on, replaying the report (attempt $attempt)"
              git fetch --depth 1 origin gh-pages
              git reset --hard FETCH_HEAD
          done
          exit 1

  report:
    name: "File or refresh the tracking issue"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      [
        sanitizers,
        clang-tidy,
        flake-hunt,
        benchmarks,
        pre-commit-full,
        docs-build,
        packaging,
        cppstd-20,
        newest-compiler,
        coverage,
        publish-coverage,
      ]
    # A lane that was cancelled or hit its timeout never reaches failure().
    if: failure() || cancelled()
    permissions:
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The comment carried a bare link, so learning what failed meant opening the run,
      # picking the job and reading a log. Five nights of findings went unread that way.
      - name: Collect the sanitizer reports the lanes archived
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: sanitizer-reports-*
          path: collected-reports

      - name: Update the nightly tracking issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          title="Nightly lane failure"
          {
            echo "Failed run: $RUN_URL"
            echo
            echo "**Jobs that failed:**"
            gh run view "${{ github.run_id }}" --repo "$REPO" --json jobs \
                --jq '.jobs[] | select(.conclusion == "failure") | "- \(.name)"' \
              || echo "- (could not be read)"
            for dir in collected-reports/sanitizer-reports-*; do
              [ -d "$dir" ] || continue
              echo
              echo "**${dir##*sanitizer-reports-}:**"
              echo
              python3 .github/scripts/summarise_sanitizer_reports.py "$dir" \
                  --known-findings .github/sanitizer-known-findings.json \
                || echo "(the summary could not be produced)"
            done
          } > comment.md
          number=$(gh issue list --repo "$REPO" --state open \
              --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$REPO" --body-file comment.md
          else
              gh issue create --repo "$REPO" --title "$title" --body-file comment.md
          fi
