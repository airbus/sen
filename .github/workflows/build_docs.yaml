name: Build documentation

# Queue deploys instead of racing them: a merge and its tag arrive seconds
# apart and both push to gh-pages, where the loser is rejected.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      # Explicitly not build for release candidates
      # - "[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"

permissions:
  contents: write
  # The documentation action drops the cache entry its save replaces.
  actions: write
  # Pulling the image the documentation is built in, which is a private package.
  packages: read

# Without this a run step gets GitHub's implicit `bash -e`, which has no pipefail, so a
# failed command in a pipeline is reported as success. The other workflows say it per step.
defaults:
  run:
    shell: bash

jobs:
  deploy_docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure git user and gh-pages repo
        run: |
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com
          git fetch origin gh-pages --depth=1

      # docs_check.yaml runs the same build on pull requests; only the
      # publishing below needs write access.
      - uses: ./.github/actions/build_documentation

      # mike runs mkdocs itself, on the runner, so the theme and plugins have to be
      # here as well as in the image the action builds the site in. Without them it
      # fails parsing mkdocs.yml rather than anything to do with publishing.
      - name: Install mike and what mkdocs needs to parse the config
        run: |
          pip install mike==2.1.3
          pip install -r docs/requirements.txt

      # The front page opens main, and a reader picks a release from the version selector.
      # Decided 2026-09-28. It is what the site has done since 2026-09-05, but by inherited
      # state rather than by choice: a plain deploy does not set the default, so once the
      # redirect moves nothing brings it back. Measured in a lab seeded with the real
      # versions.json, `set-default` is the only thing that restores it, and it commits
      # nothing when the redirect is already right.
      #
      # So a release keeps a frozen copy under its own version and takes no alias. The
      # previous `stable` alias here had never run: a tag push executes the workflow in the
      # tree the tag names, and the only tag deploy ran an older aliasless copy of this file.
      - name: Build and deploy release documentation
        if: github.event_name == 'push' && github.ref_type == 'tag'
        # A release's frozen copy carries no development banner. Explicit rather than relying on
        # the default, so the two deploys read as a pair.
        env:
          SEN_DOCS_UNRELEASED: "false"
        run: mike deploy --push --update-aliases ${{ github.ref_name }}

      # Titled rather than left as "latest", which every reader takes to mean the newest
      # release. The version id stays `latest`, so no URL changes.
      - name: Build and deploy intermediate documentation
        if: github.event_name == 'push' && github.ref_type != 'tag'
        # The front page opens this, so its pages say on themselves that they describe
        # unreleased code. The selector label alone is not enough: a reader arriving by link
        # never looks at it.
        env:
          SEN_DOCS_UNRELEASED: "true"
        run: |
          mike deploy --push --update-aliases --title "latest (in development)" latest
          mike set-default --push latest
