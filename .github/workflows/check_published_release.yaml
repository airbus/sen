#
# Installs what was just published, the way the documentation tells a user to, and checks it worked.
#
# This replaces a list of things a person was meant to observe during a release rehearsal. Two
# defects found in review were things somebody did observe, three times, without noticing: an
# install that landed in a directory named after the tarball, and a checksum step that has never
# verified anything because the file it wanted was unreachable. Neither shows up as a failure. Both
# are caught by the assertions below.
#
# It runs when a release is published rather than when a tag is pushed, because a draft is invisible
# to the installer: it reads the API with no credentials, exactly as a stranger does.

name: Check a published release

on:
  release:
    types: [published]
  # So a release that predates this workflow, or one being investigated, can be checked by hand.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to install and check"
        required: true
        type: string

permissions:
  contents: read

jobs:
  install_and_check:
    name: "Install ${{ inputs.tag || github.event.release.tag_name }} and check it"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The documented command fetches the installer from the default branch, which is the tree
      # this workflow runs from, so the checkout is the same script a user would get.
      - name: Install the release
        id: install
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          export SEN_INSTALL_HOME="$RUNNER_TEMP/sen"
          echo "SEN_INSTALL_HOME=$SEN_INSTALL_HOME" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          sh resources/installer/install.sh "$TAG" --yes 2>&1 | tee "$RUNNER_TEMP/install.log"

      # Would have caught the checksum defect: the file was attached to every rehearsal and the
      # only code that read it built a URL that 404s, so every install skipped verification and
      # said so in a note nobody treated as a failure.
      - name: The archive was verified against the release's checksums
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "publishes no SHA256SUMS" "$RUNNER_TEMP/install.log"; then
              echo "::error::release $TAG publishes no SHA256SUMS, so nothing could be verified."\
                   " Every release before 0.7.0 is in that position; from 0.7.0 on the release"\
                   " workflow attaches the file and this must not happen."
              exit 1
          fi
          grep -q "Verified sha256 checksum" "$RUNNER_TEMP/install.log" \
            || { echo "::error::the release publishes SHA256SUMS and the install did not verify against it"; exit 1; }

      - name: The install is where it says it is, and runs
        shell: bash
        run: |
          set -euo pipefail
          current="$SEN_INSTALL_HOME/current"
          for f in "$current/activate" "$current/activate.fish" "$current/.sen-manifest.sha256"; do
              [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          # shellcheck disable=SC1091
          . "$current/activate"
          command -v sen >/dev/null || { echo "::error::sen is not on PATH after activate"; exit 1; }
          out=$(sen --version)
          echo "sen --version: $out"
          # Measured against 0.6.0: it prints the bare version, so the binary can be checked
          # against the tag it was published under rather than merely for running.
          case "$out" in
              *"$TAG"*) ;;
              *) echo "::error::sen --version says '$out', the release is $TAG"; exit 1 ;;
          esac

      # Would have caught the archive-naming defect: every build type other than the release one
      # installed into a directory named after the tarball, with current pointing at it. The
      # install succeeded, so nothing failed.
      - name: A build type other than the default installs into a sane directory
        shell: bash
        run: |
          set -euo pipefail
          if ! sh resources/installer/install.sh "$TAG" --symbols --yes 2>&1 | tee "$RUNNER_TEMP/symbols.log"; then
              if grep -q "has no symbols archive" "$RUNNER_TEMP/symbols.log"; then
                  echo "this release publishes no symbols archive; nothing to check"
                  exit 0
              fi
              echo "::error::installing the symbols archive failed"
              exit 1
          fi
          for d in "$SEN_INSTALL_HOME"/*; do
              case "$d" in
                  *.tar.gz|*.zip)
                      echo "::error::installed into a directory named after the archive: $d"
                      exit 1
                      ;;
              esac
          done

      - name: The listing tells a reader which releases are supported
        shell: bash
        run: |
          set -euo pipefail
          sh resources/installer/install.sh > "$RUNNER_TEMP/listing.log" 2>&1
          cat "$RUNNER_TEMP/listing.log"
          grep -q "Available Sen releases" "$RUNNER_TEMP/listing.log" \
            || { echo "::error::the listing printed no releases section"; exit 1; }
          if [ "${{ inputs.tag || github.event.release.prerelease }}" = "true" ]; then
              grep -q "Release candidates" "$RUNNER_TEMP/listing.log" \
                || { echo "::error::a published candidate is not marked in the listing"; exit 1; }
          fi
