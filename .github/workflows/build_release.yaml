name: Build release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"

# Only the job that creates the release needs write access; the build jobs
# run the toolchain over the tagged sources.
permissions:
  contents: read
  # Reading the image the Linux legs build in, which is a private package.
  packages: read

# Without this a run step gets GitHub's implicit `bash -e`, which has no pipefail, so a
# failed command in a pipeline is reported as success. The other workflows say it per step.
defaults:
  run:
    shell: bash

jobs:
  compute-matrix-jobs:
    name: "Generate build matrix"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      jobs: ${{ steps.compute-jobs.outputs.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: 3.x

      - id: compute-jobs
        run: python .github/scripts/generate_matrix_jobs.py --release

  generate_changelog:
    name: "Generate changelog"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute changelog
        shell: bash
        # if-no-files-found on the upload below cannot fire: the generator always writes the
        # header, so the file always exists and a release with no entries would ship that header
        # and nothing else. Entries are the lines beginning "- ".
        run: |
          changelog="${{ github.workspace }}-CHANGELOG.txt"
          python .github/scripts/create_changelog.py > "$changelog"
          if ! grep -qE '^- ' "$changelog"; then
              echo "::error::the changelog has no entries, only its header"
              cat "$changelog"
              exit 1
          fi
          echo "changelog entries: $(grep -cE '^- ' "$changelog")"

      - name: Archive the generated changelog
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: changelog
          # The release body comes from this file; an empty artifact would ship
          # a release with no notes.
          if-no-files-found: error
          path: ${{ github.workspace }}-CHANGELOG.txt

  create_release_with_artifacts:
    name: "Build Job: ${{ matrix.compiler.name }}-${{ matrix.compiler.version }} C++${{ matrix.std }} [${{ matrix.build_type }}]"
    needs: compute-matrix-jobs
    runs-on: ${{ matrix.runner }}
    # This job builds and packages the release; the cap matches the matrix in
    # standard_test.yaml rather than the cheap jobs.
    timeout-minutes: 120
    strategy:
      # Same reason as standard_test.yaml.
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.compute-matrix-jobs.outputs.jobs) }}
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # A release and its debug-information counterpart are two halves of one
      # release, so both Linux legs build with the same toolchain: the image's,
      # as the lanes that test the same sources already do. Windows keeps the
      # runner, and the same wrapper decides which.
      - name: Get the image the job builds in
        if: matrix.ci_image != ''
        uses: ./.github/actions/use_ci_image
        with:
          ubuntu: ${{ matrix.ci_image }}

      # Only for a leg that builds on the runner; the image carries all of it.
      - name: Setup build context
        if: matrix.ci_image == ''
        uses: ./.github/actions/setup_build_context
        with:
          compiler-name: ${{ matrix.compiler.name }}
          compiler-version: ${{ matrix.compiler.version }}
          arch: ${{ matrix.arch }}

      # What setup_build_context does for a runner leg, and the source mirror with it.
      - name: Install the conan profiles
        if: matrix.ci_image != ''
        shell: bash
        run: |
          bash .github/scripts/in_environment.sh <<'IN'
          conan config install .conan/profiles/ --target-folder "$CONAN_HOME/profiles/"
          cp "$CONAN_HOME/profiles/sen_${{ matrix.compiler.name }}_${{ matrix.arch }}" \
             "$CONAN_HOME/profiles/default"
          printf 'core.sources:download_urls=["https://c3i.jfrog.io/artifactory/conan-center-backup-sources/", "origin"]\n' \
              >> "$CONAN_HOME/global.conf"
          conan profile show -pr default
          IN

      - name: Generate release package
        run: |
          bash .github/scripts/in_environment.sh <<'IN'
          # Nothing else carries the build type into the build, and the matrix has two
          # per compiler. Scoped with &: so the dependencies stay Release instead of
          # being rebuilt for each leg.
          # Only the shipping configuration carries debug information, and only here. Off
          # everywhere else, so nothing else pays the size or loses the compiler cache.
          symbols=''
          if [ "${{ matrix.build_type }}" = "Release" ]; then
              symbols='-o sen/*:with_release_symbols=True'
          fi
          conan install . --build=missing -s "&:build_type=${{ matrix.build_type }}" $symbols
          # conan build regenerates the toolchain, so it needs the same setting.
          conan build . -s "&:build_type=${{ matrix.build_type }}" $symbols
          build=build/${{ matrix.compiler.name }}/${{ matrix.build_type }}
          cmake --build "$build" --target package

          # The install rules moved the debug information out of the tree CPack packaged and
          # into $build/symbols, naming the archive there so this does not repeat the version,
          # architecture and compiler that CPack already worked out.
          if [ -d "$build/symbols" ]; then
              name=$(cat "$build/symbols/archive-name")
              staging="$build/symbols-staging/$name"
              mkdir -p "$staging"
              cp -R "$build/symbols/." "$staging/"
              rm -f "$staging/archive-name"
              # Same format as the release archive beside it: a Windows user gets a zip.
              # shutil rather than tar or 7z, which are not both present on both runners.
              # Defaulted: in_image.sh does not forward RUNNER_OS, and the container
              # shell runs with -u, so a bare reference aborts the Linux leg.
              format=$([ "${RUNNER_OS:-}" = "Windows" ] && echo zip || echo gztar)
              python -c "import shutil,sys; shutil.make_archive(*sys.argv[1:])" \
                  "$build/$name" "$format" "$build/symbols-staging" "$name"
          fi
          # The option above is the only thing that knows a symbols archive was asked for, so it
          # is the only place that can assert one arrived. Without this a build that produced
          # none packages a short set and every job stays green.
          expect=''
          if [ -n "$symbols" ]; then
              expect='--expect-symbols'
          fi
          python .github/scripts/check_package_archive.py "$build" $expect
          IN

      - name: Archive generated release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # An archive that does not match is a broken release, not a warning.
          if-no-files-found: error
          # The build type belongs in the name: both legs of a compiler would otherwise
          # upload to one artifact, and a name cannot be written twice.
          name: release-${{ matrix.compiler.name }}-${{ matrix.build_type }}
          # sen-0.1.0-x86_64-linux-gnu-12.4.0-release.tar.gz
          # sen-0.1.0-amd64-windows-msvc-19.44.35223.0-release.zip
          path: build/${{ matrix.compiler.name }}/${{ matrix.build_type }}/sen-${{ github.ref_name }}-*

  attach_release_artifacts:
    name: "Create Release Draft"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    needs:
      - create_release_with_artifacts
      - generate_changelog
    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1

      - name: Print context
        run: |
          ls -rlisa
          cat changelog/sen-CHANGELOG.txt

      # The installer verifies what it downloads against this file, and treats
      # its absence as "verification skipped". Without it every install is
      # unverified, so the release must carry it.
      - name: Write SHA256SUMS
        shell: bash
        run: |
          shopt -s nullglob
          archives=(release-*/*)
          if [ ${#archives[@]} -eq 0 ]; then
              echo "no release archives to checksum"
              exit 1
          fi
          for archive in "${archives[@]}"; do
              (cd "$(dirname "$archive")" && sha256sum "$(basename "$archive")")
          done > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        if: github.ref_type == 'tag'
        with:
          body_path: changelog/sen-CHANGELOG.txt
          files: |
            release-*/*
            SHA256SUMS
          fail_on_unmatched_files: true
          preserve_order: true
          draft: true
          prerelease: ${{ contains(github.ref_name, 'rc') }}
          # GitHub creates the tag when a draft is published, and defaults it to the default
          # branch. Release-candidate tags get deleted here routinely and tag protection is off,
          # so publishing a draft whose tag had gone would have pointed the release at whatever
          # main had become, describing a tree the attached archives were not built from. In the
          # normal flow the tag exists and no ref is created, so this only bites in that case,
          # where the action documents a possible 403 for the default token. A refusal there is
          # the better outcome.
          target_commitish: ${{ github.sha }}

  # Moved here from build_docs.yaml, which ran it on the same tag push and so raced the release
  # this uploads to: that job starts after the whole build matrix, about twenty minutes in, while
  # a docs run takes six to thirteen. Whether the asset was attached depended on how many
  # main-branch runs were queued ahead of the docs run in its concurrency group, which is to say
  # on unrelated merge traffic. Here the release exists by construction, and the wait below is on
  # the docs deploy, which has normally finished long before this job starts.
  attach_documentation:
    name: "Attach the published documentation"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    needs: attach_release_artifacts
    steps:
      # Taken from gh-pages after the deploy rather than from the build tree, so the asset is
      # what was published and not a second build of it. Re-publishing a release then means
      # uploading this, which is the only way to reproduce a site whose dependency versions were
      # never recorded: releases before 0.7.0 have no conan.lock, and rebuilding them today
      # resolves to versions their tree cannot build.
      - name: Wait for the documentation deploy, then attach it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          # Bounded rather than open: if the docs deploy failed, this says so instead of hanging
          # until the job times out with nothing to read.
          # Ten minutes of grace. This job starts after the whole build matrix, around twenty
          # minutes in, and a docs run takes six to thirteen, so the deploy is normally already
          # there and the first check passes.
          for attempt in $(seq 1 20); do
              git fetch -q --depth=1 origin gh-pages || true
              if git cat-file -e "origin/gh-pages:$TAG" 2>/dev/null; then
                  echo "documentation for $TAG is published"
                  break
              fi
              if [ "$attempt" -eq 20 ]; then
                  echo "::error::gh-pages has no $TAG directory after ten minutes; the documentation deploy for this tag did not finish"
                  exit 1
              fi
              sleep 30
          done
          staged=$(mktemp -d)
          git archive "origin/gh-pages" "$TAG" | tar -x -C "$staged"
          tar -czf "sen-docs-$TAG.tar.gz" -C "$staged" "$TAG"
          gh release upload "$TAG" "sen-docs-$TAG.tar.gz" --clobber
