name: Check the documentation

# Publishing lives in build_docs.yaml, which needs write access to
# gh-pages. This workflow stays read-only: it builds unreviewed
# pull-request content.

on:
  workflow_call:

permissions:
  contents: read
  # build_documentation drops the cache entries its saves replace.
  actions: write

jobs:
  build_docs:
    name: "Build the documentation"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/build_documentation
