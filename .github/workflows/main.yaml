name: Orchestrator Workflow

on:
  # The default types do not fire when a draft is marked ready; converting
  # back to draft lands in the same concurrency group and cancels the run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
  push:
    # release/** as well as main: the release ruleset requires no checks and lets its team push
    # directly, so a merge taken that way is only ever measured here.
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

# One run per branch and trigger kind; a new event cancels the running one.
# event_name is in the key so the nightly cannot cancel a push to main.
#
# Not on a push, which here is only a merge to main: each run classifies from
# the commit main moved from, so a cancelled run's range falls into no other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  standard-tests:
    uses: ./.github/workflows/standard_test.yaml
    permissions:
      contents: read
      # The lane drops the cache entry its save replaces.
      actions: write
      # And its Linux legs pull the image they build in.
      packages: read
    with:
      building-main: ${{ github.ref == 'refs/heads/main' }}
