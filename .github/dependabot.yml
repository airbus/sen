#
# Keeps the SHA-pinned GitHub Actions and the CI image base current.
# Monthly cadence: dependency movement arrives as a reviewable batch.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /tools/ci
    schedule:
      interval: monthly
