#
# Keeps the SHA-pinned GitHub Actions and the CI image base current.
# Monthly cadence: dependency movement arrives as a reviewable batch.
#
# Minor and patch updates are grouped into one pull request, because they carry no
# decision. Major updates stay separate: each needs checking against how this
# repository actually uses the action, and holding one must not hold the others.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    # The default of 5 hides updates once majors accumulate.
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /tools/ci
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # The base OS is pinned on purpose. The binaries are built on the runner, not in
      # the CI image, so what runtime.Dockerfile has to match is the runner label the
      # matrix gives that leg -- test_generate_matrix_jobs.py checks that pair. Moving
      # this is a coordinated change across the images and the matrix rather than a
      # dependency bump. Raise it by hand when the time comes.
      - dependency-name: ubuntu

  # The four javascript projects: the MCP gateway, the TypeScript client, the web explorer
  # frontend and the VS Code extension. One pull request per batch rather than one per
  # package, because a set of javascript bumps carries no decision and each pull request
  # runs the whole C++ matrix, which none of them can affect.
  #
  # Security fixes need their own group. A group without applies-to covers ordinary version
  # updates only, so without the second one security fixes keep arriving separately, which
  # is what filled the queue when the javascript projects landed.
  - package-ecosystem: npm
    directory: /apps/mcp_gateway
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
    groups:
      mcp-gateway:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      mcp-gateway-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /components/jsonrpc/clients/typescript
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
    groups:
      jsonrpc-ts-client:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      jsonrpc-ts-client-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /components/webexplorer/frontend
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
    groups:
      web-explorer:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      web-explorer-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /resources/syntax_highlighting/stl/vscode
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
    groups:
      vscode-extension:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      vscode-extension-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The two python manifests. Same shape as the javascript projects: grouped for the
  # updates that carry no decision, and majors left on their own.
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
    groups:
      docs:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      docs-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch


  # The two python manifests. Same shape as the javascript projects: grouped for the
  # updates that carry no decision, and majors left on their own.
  - package-ecosystem: pip
    directory: /examples/apps/rest_python
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
    groups:
      rest-python-example:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      rest-python-example-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
